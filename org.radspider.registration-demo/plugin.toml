# Example of a two-volume tool (api 3): the active series is the fixed image, the second series the moving one.
id = "org.radspider.registration-demo"
name = "Registration demo"
version = "1.1.0"
api = 6
description = "Translation-only registration of a second series onto the active one (numpy, cross-correlation)."
icon = "intersect"
requirements = "requirements.txt"

[[tool]]
name = "translate"
label = "Translation registration"
description = "Finds the shift (no rotation, no scaling) that best lays the second series over the active one and returns it on the active series' grid."
second_volume = true
icon = "arrows-out-cardinal"
unit = "keep"
params = [{ name = "subvoxel", label = "Sub-voxel shift", kind = "bool", default = true }]
