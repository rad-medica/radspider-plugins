# Translation template of the plugin org.radspider.pirads: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"PI-RADS report" = ""
"Structured prostate MRI report: prostate volume and PSA density, lesions drawn on an axial sector map with size and T2W, DWI and DCE scores, the PI-RADS v2.1 category of each (computed), local staging and the overall category. Not a medical device." = ""
"Opens a form with a sector map: prostate size and PSA; drag on a section to draw a lesion, then give its sequence scores, extraprostatic extension; nodes and bone. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = ""

