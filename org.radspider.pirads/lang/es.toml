# PI-RADS report: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"PI-RADS report" = "Informe PI-RADS"
"Structured prostate MRI report: prostate volume and PSA density, up to four lesions with sector, size and T2W, DWI and DCE scores, the PI-RADS v2.1 category of each (computed), local staging and the overall category. Not a medical device." = "Informe estructurado de RM de próstata: volumen prostático y densidad de APE, hasta cuatro lesiones con sector, tamaño y puntajes T2, DWI y DCE, la categoría PI-RADS v2.1 de cada una (calculada), etapificación local y la categoría global. No es un dispositivo médico."
"Opens a form: prostate size and PSA, lesions with their sequence scores, extraprostatic extension, nodes and bone. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = "Abre un formulario: tamaño prostático y APE, lesiones con sus puntajes por secuencia, extensión extraprostática, linfonodos y hueso. La tabla del informe se actualiza con cada cambio; Copiar tabla la deja en el portapapeles. No lee píxeles."

