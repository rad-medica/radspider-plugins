# Translation template of the plugin org.radspider.radiomics: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"Radiomics (pyradiomics)" = ""
"pyradiomics features per segment (first order, shape, GLCM, GLRLM, GLSZM, GLDM, NGTDM; optional LoG and wavelet filters), as one table to save as CSV. The options of SlicerRadiomics." = ""
"Opens a window with the feature classes, the segment and the pyradiomics options; Extract computes the features of each segment: one row per feature, one column per segment, with the pyradiomics diagnostics rows. Needs at least one segment." = ""

