[strings]

# plugin.toml
"Skeletal radiology" = "Radiología esquelética"
"Automatic skeletal radiography measurements with interactive refinement: spine (Cobb angle, coronal/sagittal balance, vertebral wedging), lower limb alignment (HKA, MAD, mLDFA, MPTA, JLCA, limb lengths and discrepancy), hip and pelvis (Wiberg LCEA, Tönnis angle, neck-shaft CCD angle, pelvic obliquity), diaphyseal cortical morphometry (Barnett-Nordin index, corticomedullary ratio), and foot/hand goniometry (hallux valgus, intermetatarsal, Böhler, Gissane, metacarpal index)." = "Mediciones automáticas en radiografía esquelética con refinamiento interactivo: columna (ángulo de Cobb, equilibrio coronal/sagital, acuñamiento vertebral), alineación del miembro inferior (HKA, MAD, mLDFA, MPTA, JLCA, longitudes del miembro y dismetría), cadera y pelvis (ángulo CE de Wiberg, ángulo de Tönnis, ángulo cervicodiafisario CCD, oblicuidad pélvica), morfometría cortical diafisaria (índice de Barnett-Nordin, razón corticomedular) y goniometría de pie y mano (hallux valgus, intermetatarsiano, Böhler, Gissane, índice metacarpiano)."
"Skeletal bone mask" = "Máscara ósea esquelética"
"Segments bright osseous structures slice by slice from a local-plus-global intensity percentile threshold, morphological hole closing and minimum area filtering." = "Segmenta las estructuras óseas brillantes corte a corte a partir de un umbral de percentil de intensidad local y global, cierre morfológico de huecos y filtrado por área mínima."
"Bone intensity percentile (%)" = "Percentil de intensidad ósea (%)"
"Close holes (mm, 0 = off)" = "Cerrar huecos (mm, 0 = desactivado)"
"Smallest bone island (mm²)" = "Isla ósea más pequeña (mm²)"
"Spine morphometry" = "Morfometría de la columna"
"Automatic spine measurements on an AP/PA or lateral radiograph: spinal midline curve, maximally tilted superior and inferior endplates, Cobb angle, coronal/sagittal plumb offset and apical vertebral wedge ratio. Interactive window refines thresholds and endplate levels; two drawn lines on the slice override the endplates." = "Mediciones automáticas de la columna en una radiografía AP/PA o lateral: curva de la línea media espinal, platillos superior e inferior con máxima inclinación, ángulo de Cobb, desviación de la plomada coronal/sagital y razón de acuñamiento de la vértebra apical. La ventana interactiva ajusta los umbrales y los niveles de los platillos; dos líneas dibujadas en el corte sustituyen a los platillos."
"Midline smoothing (mm)" = "Suavizado de la línea media (mm)"
"Lower limb alignment" = "Alineación del miembro inferior"
"Automatic full-leg tele-radiography (pangoniometry) for right and/or left lower limb: hip center, femoral knee center, tibial knee center and ankle plafond center; HKA mechanical angle, MAD (mm), mLDFA, MPTA, JLCA, femoral/tibial/total lengths and leg length discrepancy (LLD). Interactive window refines landmarks or uses placed probes/lines." = "Telerradiografía automática de miembros inferiores completos (pangonometría) del miembro inferior derecho y/o izquierdo: centro de la cadera, centro femoral de la rodilla, centro tibial de la rodilla y centro del plafón tibial; ángulo mecánico HKA, MAD (mm), mLDFA, MPTA, JLCA, longitudes femoral, tibial y total, y dismetría de miembros inferiores (LLD). La ventana interactiva ajusta los puntos de referencia o usa sondas y líneas colocadas."
"Close bone contour (mm)" = "Cerrar el contorno óseo (mm)"
"Hip and pelvis" = "Cadera y pelvis"
"Automatic AP pelvis and hip goniometry: bilateral femoral head centers and diameters, pelvic horizontal reference line (obliquity in ° and mm), Wiberg lateral center-edge angle (LCEA), Tönnis acetabular index, cervicodiaphyseal neck-shaft angle (CCD) and femoral offset. Interactive window adjusts levels or uses drawn ellipses/probes." = "Goniometría automática de pelvis y cadera en AP: centros y diámetros de ambas cabezas femorales, línea horizontal de referencia pélvica (oblicuidad en ° y mm), ángulo centro-borde lateral de Wiberg (LCEA), índice acetabular de Tönnis, ángulo cervicodiafisario (CCD) y offset femoral. La ventana interactiva ajusta los niveles o usa elipses y sondas dibujadas."
"Expected femoral head radius (mm, 0 = auto)" = "Radio esperado de la cabeza femoral (mm, 0 = automático)"
"Bone morphometry" = "Morfometría ósea"
"Automatic diaphyseal radiogrammetry and cortical morphometry of a tubular bone: bone length, anatomical axis, outer periosteal diameter (D), inner medullary diameter (d), combined cortical thickness (CCT), Barnett-Nordin cortical index (%), corticomedullary ratio and cross-sectional cortical area. Interactive window slides the measurement level along the shaft." = "Radiogrametría diafisaria y morfometría cortical automáticas de un hueso tubular: longitud del hueso, eje anatómico, diámetro perióstico externo (D), diámetro medular interno (d), grosor cortical combinado (CCT), índice cortical de Barnett-Nordin (%), razón corticomedular y área cortical transversal. La ventana interactiva desliza el nivel de medida a lo largo de la diáfisis."
"Diaphyseal level (0.2–0.8, 0.5 = mid-shaft)" = "Nivel diafisario (0,2–0,8; 0,5 = mitad de la diáfisis)"
"Foot and hand" = "Pie y mano"
"Automatic extremity radiographic goniometry with interactive view selection: Foot AP (hallux valgus angle HVA, 1st–2nd intermetatarsal angle IMA), Foot Lateral (Böhler calcaneal angle, Gissane angle, calcaneal pitch) and Hand/Wrist AP (2nd metacarpal index MCI, radial inclination). Uses drawn lines when present." = "Goniometría radiográfica automática de extremidades con selección interactiva de la proyección: pie AP (ángulo de hallux valgus HVA, ángulo intermetatarsiano 1.º–2.º IMA), pie lateral (ángulo calcáneo de Böhler, ángulo de Gissane, pitch calcáneo) y mano/muñeca AP (índice metacarpiano del 2.º metacarpiano MCI, inclinación radial). Usa las líneas dibujadas cuando las hay."
"View" = "Proyección"
"Auto detect" = "Detección automática"
"Foot AP" = "Pie AP"
"Foot lateral" = "Pie lateral"
"Hand / wrist AP" = "Mano / muñeca AP"

