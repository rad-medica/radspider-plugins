# Translation template of the plugin org.radspider.skeletal-radiology: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"Skeletal radiology" = ""
"Automatic skeletal radiography measurements with interactive refinement: spine (Cobb angle, coronal/sagittal balance, vertebral wedging), lower limb alignment (HKA, MAD, mLDFA, MPTA, JLCA, limb lengths and discrepancy), hip and pelvis (Wiberg LCEA, Tönnis angle, neck-shaft CCD angle, pelvic obliquity), diaphyseal cortical morphometry (Barnett-Nordin index, corticomedullary ratio), and foot/hand goniometry (hallux valgus, intermetatarsal, Böhler, Gissane, metacarpal index)." = ""
"Skeletal bone mask" = ""
"Segments bright osseous structures slice by slice from a local-plus-global intensity percentile threshold, morphological hole closing and minimum area filtering." = ""
"Bone intensity percentile (%)" = ""
"Close holes (mm, 0 = off)" = ""
"Smallest bone island (mm²)" = ""
"Spine morphometry" = ""
"Automatic spine measurements on an AP/PA or lateral radiograph: spinal midline curve, maximally tilted superior and inferior endplates, Cobb angle, coronal/sagittal plumb offset and apical vertebral wedge ratio. Interactive window refines thresholds and endplate levels; two drawn lines on the slice override the endplates." = ""
"Midline smoothing (mm)" = ""
"Lower limb alignment" = ""
"Automatic full-leg tele-radiography (pangoniometry) for right and/or left lower limb: hip center, femoral knee center, tibial knee center and ankle plafond center; HKA mechanical angle, MAD (mm), mLDFA, MPTA, JLCA, femoral/tibial/total lengths and leg length discrepancy (LLD). Interactive window refines landmarks or uses placed probes/lines." = ""
"Close bone contour (mm)" = ""
"Hip and pelvis" = ""
"Automatic AP pelvis and hip goniometry: bilateral femoral head centers and diameters, pelvic horizontal reference line (obliquity in ° and mm), Wiberg lateral center-edge angle (LCEA), Tönnis acetabular index, cervicodiaphyseal neck-shaft angle (CCD) and femoral offset. Interactive window adjusts levels or uses drawn ellipses/probes." = ""
"Expected femoral head radius (mm, 0 = auto)" = ""
"Bone morphometry" = ""
"Automatic diaphyseal radiogrammetry and cortical morphometry of a tubular bone: bone length, anatomical axis, outer periosteal diameter (D), inner medullary diameter (d), combined cortical thickness (CCT), Barnett-Nordin cortical index (%), corticomedullary ratio and cross-sectional cortical area. Interactive window slides the measurement level along the shaft." = ""
"Diaphyseal level (0.2–0.8, 0.5 = mid-shaft)" = ""
"Foot and hand" = ""
"Automatic extremity radiographic goniometry with interactive view selection: Foot AP (hallux valgus angle HVA, 1st–2nd intermetatarsal angle IMA), Foot Lateral (Böhler calcaneal angle, Gissane angle, calcaneal pitch) and Hand/Wrist AP (2nd metacarpal index MCI, radial inclination). Uses drawn lines when present." = ""
"View" = ""
"Auto detect" = ""
"Foot AP" = ""
"Foot lateral" = ""
"Hand / wrist AP" = ""

