description = """CT only, task 557. White matter, gray matter, cerebrospinal fluid, scalp, eyeballs, compact and spongy bone, vascular structure of head, rectus eye muscles. Post-processing first runs task 553 to find the brain (a second 760 MB model) and returns nothing when the head is not in the scan. The first run of each task and weight variant downloads 760 MB (GitHub release, \
SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM."""
