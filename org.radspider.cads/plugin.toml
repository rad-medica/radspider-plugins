# CADS-model (murong-xu/CADS): 167 structures on CT in nine task groups (551-559), one entry per group, as in the
# 3D Slicer extension CADSWholeBodyCTSeg. Code Apache-2.0. Weights: "open" variant CC BY-SA 4.0 (default) or
# "research" variant CC BY-NC-SA 4.0 (non-commercial); the "reference" variant is not offered. See docs/plugins/cads.md.
id = "org.radspider.cads"
name = "CADS whole body CT"
version = "1.1.0"
api = 6
icon = "person-arms-spread"
description = "167 anatomical structures on CT in nine groups (CADS-model, nnU-Net ResEnc L at 1.5 mm), run with PyTorch."
requirements = "requirements.txt"

[[segmentation]]
name = "core_organs"
icon = "stethoscope"
label = "CADS: core organs (17 structures)"
description = """CT only, task 551. Spleen, kidneys, gallbladder, liver, stomach, aorta, inferior vena cava, portal and splenic vein, pancreas, adrenal glands, the five lung lobes. The first run of each task and weight variant downloads 760 MB (GitHub release, \
SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM."""
params = [
  { name = "overlap_step", label = "Window step (fraction of the window)", default = 0.5, min = 0.25, max = 1.0 },
  { name = "weights", label = "Weights", kind = "choice", options = ["open (CC BY-SA 4.0)", "research (CC BY-NC-SA 4.0, non-commercial)"], default = "open (CC BY-SA 4.0)" },
  { name = "postprocess", label = "CADS post-processing", kind = "bool", default = true },
]

[[segmentation]]
name = "spine"
icon = "stack"
label = "CADS: spine (24 structures)"
description = """CT only, task 552. Vertebrae C1-C7, T1-T12, L1-L5. The first run of each task and weight variant downloads 760 MB (GitHub release, \
SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM."""
params = [
  { name = "overlap_step", label = "Window step (fraction of the window)", default = 0.5, min = 0.25, max = 1.0 },
  { name = "weights", label = "Weights", kind = "choice", options = ["open (CC BY-SA 4.0)", "research (CC BY-NC-SA 4.0, non-commercial)"], default = "open (CC BY-SA 4.0)" },
  { name = "postprocess", label = "CADS post-processing", kind = "bool", default = true },
]

