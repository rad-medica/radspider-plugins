# plugin.toml
"CADS whole body CT" = "CADS: TC de cuerpo entero"
"167 anatomical structures on CT in nine groups (CADS-model, nnU-Net ResEnc L at 1.5 mm), run with PyTorch." = "167 estructuras anatómicas en TC, en nueve grupos (modelo CADS, nnU-Net ResEnc L a 1,5 mm), ejecutado con PyTorch."
"CADS: core organs (17 structures)" = "CADS: órganos principales (17 estructuras)"
"CT only, task 551. Spleen, kidneys, gallbladder, liver, stomach, aorta, inferior vena cava, portal and splenic vein, pancreas, adrenal glands, the five lung lobes. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 551. Bazo, riñones, vesícula biliar, hígado, estómago, aorta, vena cava inferior, vena porta y esplénica, páncreas, glándulas suprarrenales, los cinco lóbulos pulmonares. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"Window step (fraction of the window)" = "Paso de ventana (fracción de la ventana)"
"Weights" = "Pesos"
"open (CC BY-SA 4.0)" = "abiertos (CC BY-SA 4.0)"
"research (CC BY-NC-SA 4.0, non-commercial)" = "de investigación (CC BY-NC-SA 4.0, no comercial)"
"CADS post-processing" = "Posprocesamiento de CADS"
"CADS: spine (24 structures)" = "CADS: columna vertebral (24 estructuras)"
"CT only, task 552. Vertebrae C1-C7, T1-T12, L1-L5. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 552. Vértebras C1-C7, T1-T12, L1-L5. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"CADS: heart & vessels (18 structures)" = "CADS: corazón y vasos (18 estructuras)"
"CT only, task 553. Esophagus, trachea, myocardium, heart atria and ventricles, pulmonary artery, brain, common iliac arteries and veins, small intestine, duodenum, colon, urinary bladder, face. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 553. Esófago, tráquea, miocardio, aurículas y ventrículos cardíacos, arteria pulmonar, encéfalo, arterias y venas ilíacas comunes, intestino delgado, duodeno, colon, vejiga urinaria, cara. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"CADS: trunk muscles (21 structures)" = "CADS: músculos del tronco (21 estructuras)"
"CT only, task 554. Humeri, scapulae, clavicles, femora, hips, sacrum, gluteus maximus / medius / minimus, deep muscles of the back, iliopsoas. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 554. Húmeros, escápulas, clavículas, fémures, caderas, sacro, glúteo mayor / medio / menor, músculos profundos de la espalda, iliopsoas. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"CADS: ribs (24 structures)" = "CADS: costillas (24 estructuras)"
"CT only, task 555. Ribs 1-12, left and right. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 555. Costillas 1-12, izquierdas y derechas. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"CADS: RT risk organs (15 structures)" = "CADS: órganos de riesgo en RT (15 estructuras)"
"CT only, task 556. Spinal canal, larynx, heart, bowel space, sigmoid colon, rectum, prostate, seminal vesicle, mammary glands, sternum, psoas major and rectus abdominis muscles. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 556. Canal medular, laringe, corazón, espacio intestinal, colon sigmoide, recto, próstata, vesícula seminal, glándulas mamarias, esternón, músculos psoas mayor y recto del abdomen. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"CADS: brain tissues (9 structures)" = "CADS: tejidos cerebrales (9 estructuras)"
"CT only, task 557. White matter, gray matter, cerebrospinal fluid, scalp, eyeballs, compact and spongy bone, vascular structure of head, rectus eye muscles. Post-processing first runs task 553 to find the brain (a second 760 MB model) and returns nothing when the head is not in the scan. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 557. Sustancia blanca, sustancia gris, líquido cefalorraquídeo, cuero cabelludo, globos oculares, hueso compacto y esponjoso, estructura vascular de la cabeza, músculos rectos oculares. El posprocesamiento ejecuta primero la tarea 553 para localizar el encéfalo (un segundo modelo de 760 MB) y no devuelve nada cuando la cabeza no está en el estudio. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"CADS: head-neck organs (29 structures)" = "CADS: órganos de cabeza y cuello (29 estructuras)"
"CT only, task 558. Carotid arteries, mandible, brain stem, oral cavity, cochleae, eyeball segments, lacrimal, submandibular, parotid, thyroid and pituitary glands, larynx parts, optic chiasm and nerves, and more. Post-processing first runs task 553 to find the brain (a second 760 MB model) and, without a brain, task 552 for the upper vertebrae (a third); it returns nothing when neither is in the scan. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 558. Arterias carótidas, mandíbula, tronco encefálico, cavidad oral, cócleas, segmentos del globo ocular, glándulas lagrimales, submandibulares, parótidas, tiroides e hipófisis, partes de la laringe, quiasma y nervios ópticos, y más. El posprocesamiento ejecuta primero la tarea 553 para localizar el encéfalo (un segundo modelo de 760 MB) y, sin encéfalo, la tarea 552 para las vértebras superiores (un tercero); no devuelve nada si ninguno está en el estudio. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."
"CADS: body regions (10 structures)" = "CADS: regiones corporales (10 estructuras)"
"CT only, task 559. Subcutaneous tissue, muscle, abdominopelvic and thoracic cavity, bone, gland structure, pericardium, breast implant, mediastinum, spinal cord. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = "Solo TC, tarea 559. Tejido subcutáneo, músculo, cavidad abdominopélvica y torácica, hueso, estructura glandular, pericardio, implante mamario, mediastino, médula espinal. La primera ejecución de cada tarea y variante de pesos descarga 760 MB (versión de GitHub, con comprobación SHA-256). Es un modelo pensado para GPU: con 4 núcleos de CPU una ventana tarda unos 20 s (minutos por tarea) y la ejecución necesita 9 GB de RAM."

