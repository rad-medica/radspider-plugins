"CADS: heart & vessels (18 structures)" = ""
"CT only, task 553. Esophagus, trachea, myocardium, heart atria and ventricles, pulmonary artery, brain, common iliac arteries and veins, small intestine, duodenum, colon, urinary bladder, face. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = ""
"CADS: trunk muscles (21 structures)" = ""
"CT only, task 554. Humeri, scapulae, clavicles, femora, hips, sacrum, gluteus maximus / medius / minimus, deep muscles of the back, iliopsoas. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = ""
"CADS: ribs (24 structures)" = ""
"CT only, task 555. Ribs 1-12, left and right. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = ""
"CADS: RT risk organs (15 structures)" = ""
"CT only, task 556. Spinal canal, larynx, heart, bowel space, sigmoid colon, rectum, prostate, seminal vesicle, mammary glands, sternum, psoas major and rectus abdominis muscles. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = ""
"CADS: brain tissues (9 structures)" = ""
"CT only, task 557. White matter, gray matter, cerebrospinal fluid, scalp, eyeballs, compact and spongy bone, vascular structure of head, rectus eye muscles. Post-processing first runs task 553 to find the brain (a second 760 MB model) and returns nothing when the head is not in the scan. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = ""
"CADS: head-neck organs (29 structures)" = ""
"CT only, task 558. Carotid arteries, mandible, brain stem, oral cavity, cochleae, eyeball segments, lacrimal, submandibular, parotid, thyroid and pituitary glands, larynx parts, optic chiasm and nerves, and more. Post-processing first runs task 553 to find the brain (a second 760 MB model) and, without a brain, task 552 for the upper vertebrae (a third); it returns nothing when neither is in the scan. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = ""
"CADS: body regions (10 structures)" = ""
"CT only, task 559. Subcutaneous tissue, muscle, abdominopelvic and thoracic cavity, bone, gland structure, pericardium, breast implant, mediastinum, spinal cord. The first run of each task and weight variant downloads 760 MB (GitHub release, SHA-256 checked). A GPU-class model: on 4 CPU cores a window takes about 20 s (minutes per task) and the run needs 9 GB of RAM." = ""

