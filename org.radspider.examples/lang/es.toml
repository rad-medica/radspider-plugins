# Examples: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"Examples" = "Ejemplos"
"One entry of each kind, standard library only." = "Una entrada de cada tipo, solo con la biblioteca estándar."
