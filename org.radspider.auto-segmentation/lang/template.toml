# Translation template of the plugin org.radspider.auto-segmentation: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"Automatic segmentation" = ""
"Automatic anatomical segmentation of CT with a choice of model (TotalSegmentator, MONAI whole body, CADS), and a window that manages the downloaded weights." = ""
"Automatic segmentation (CT)" = ""
"CT only. Pick the model: TotalSegmentator (117 structures, 3 mm, ONNX Runtime), MONAI whole body (104 structures, 3 or 1.5 mm) or one of the nine CADS groups (167 structures over the nine, 1.5 mm, a GPU-class model: about 20 s per window and 9 GB of RAM on 4 CPU cores). The first run of a model downloads its weights (TotalSegmentator 135 MB, MONAI 71 MB, CADS 760 MB per group and weight set) in the background; Segmentation models downloads or deletes them beforehand." = ""
