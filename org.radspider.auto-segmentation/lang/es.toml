# Automatic segmentation: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"Automatic segmentation" = "Segmentación automática"
"Automatic anatomical segmentation of CT with a choice of model (TotalSegmentator, MONAI whole body, CADS), and a window that manages the downloaded weights." = "Segmentación anatómica automática de TC con elección de modelo (TotalSegmentator, MONAI de cuerpo entero, CADS) y una ventana que gestiona los pesos descargados."
"Automatic segmentation (CT)" = "Segmentación automática (TC)"
"CT only. Pick the model: TotalSegmentator (117 structures, 3 mm, ONNX Runtime), MONAI whole body (104 structures, 3 or 1.5 mm) or one of the nine CADS groups (167 structures over the nine, 1.5 mm, a GPU-class model: about 20 s per window and 9 GB of RAM on 4 CPU cores). The first run of a model downloads its weights (TotalSegmentator 135 MB, MONAI 71 MB, CADS 760 MB per group and weight set); Segmentation models downloads or deletes them beforehand." = "Solo TC. Elija el modelo: TotalSegmentator (117 estructuras, 3 mm, ONNX Runtime), MONAI de cuerpo entero (104 estructuras, 3 o 1,5 mm) o uno de los nueve grupos de CADS (167 estructuras entre los nueve, 1,5 mm, un modelo pensado para GPU: unos 20 s por ventana y 9 GB de RAM con 4 núcleos de CPU). La primera ejecución de un modelo descarga sus pesos (TotalSegmentator 135 MB, MONAI 71 MB, CADS 760 MB por grupo y juego de pesos); Modelos de segmentación los descarga o borra de antemano."
"Model" = "Modelo"
"TotalSegmentator: 117 structures (3 mm)" = "TotalSegmentator: 117 estructuras (3 mm)"
"MONAI whole body: 104 structures (3 mm)" = "MONAI cuerpo entero: 104 estructuras (3 mm)"
"MONAI whole body: 104 structures (1.5 mm)" = "MONAI cuerpo entero: 104 estructuras (1,5 mm)"
"CADS 551: core organs (17 structures)" = "CADS 551: órganos principales (17 estructuras)"
"CADS 552: spine (24 structures)" = "CADS 552: columna vertebral (24 estructuras)"
"CADS 553: heart & vessels (18 structures)" = "CADS 553: corazón y vasos (18 estructuras)"
"CADS 554: trunk muscles (21 structures)" = "CADS 554: músculos del tronco (21 estructuras)"
"CADS 555: ribs (24 structures)" = "CADS 555: costillas (24 estructuras)"
"CADS 556: RT risk organs (15 structures)" = "CADS 556: órganos de riesgo en RT (15 estructuras)"
"CADS 557: brain tissues (9 structures)" = "CADS 557: tejidos cerebrales (9 estructuras)"
"CADS 558: head-neck organs (29 structures)" = "CADS 558: órganos de cabeza y cuello (29 estructuras)"
"CADS 559: body regions (10 structures)" = "CADS 559: regiones corporales (10 estructuras)"
"Window step (fraction of the window; 0 = the model's default)" = "Paso de ventana (fracción de la ventana; 0 = el valor por defecto del modelo)"
"CADS weights" = "Pesos de CADS"
"open (CC BY-SA 4.0)" = "abiertos (CC BY-SA 4.0)"
"research (CC BY-NC-SA 4.0, non-commercial)" = "de investigación (CC BY-NC-SA 4.0, no comercial)"
"CADS post-processing" = "Posprocesamiento de CADS"
"Segmentation models" = "Modelos de segmentación"
"Lists the weights of every model with their licence, size on disk and state; downloads one ahead of its first run, deletes one, or removes what interrupted downloads left behind. Opens on the active series because every plugin tool does; the series is not read." = "Lista los pesos de cada modelo con su licencia, tamaño en disco y estado; descarga uno antes de su primera ejecución, borra uno o elimina lo que dejaron descargas interrumpidas. Se abre sobre la serie activa porque toda herramienta de plugin lo hace; la serie no se lee."

