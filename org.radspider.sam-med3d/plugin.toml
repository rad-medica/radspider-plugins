# Interactive 3D segmentation with SAM-Med3D (https://github.com/uni-medical/SAM-Med3D, Apache-2.0).
id = "org.radspider.sam-med3d"
name = "SAM-Med3D"
version = "1.1.0"
api = 6
icon = "cube"
description = "Click-prompted 3D segmentation: place Probe measurements on the object, run, get a segment."
requirements = "requirements.txt"

[[segmentation]]
name = "segment"
icon = "crosshair"
label = "SAM-Med3D: segment from clicks"
description = """Each Probe measurement on the series is a positive click. A Text measurement reading '-' is a negative click. \
Without Probes the run fails and says so. The first run downloads the checkpoint (~400 MB, Hugging Face)."""
params = [
  { name = "separate", label = "One segment per click", kind = "bool", default = false },
  { name = "iterations", label = "Decoder passes (refinement)", kind = "integer", default = 1, min = 1, max = 5 },
  { name = "threshold", label = "Probability threshold", default = 0.5, min = 0.05, max = 0.95 },
]
