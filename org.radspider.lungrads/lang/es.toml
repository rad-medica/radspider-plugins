# Lung-RADS report: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"Lung-RADS report" = "Informe Lung-RADS"
"Structured lung cancer screening CT report: up to six nodules or atypical cysts with lobe, type, behaviour and mean diameters, the Lung-RADS v2022 category of each (computed, or assigned where the rules give none), 4X and S modifiers, category 0 and management. Not a medical device." = "Informe estructurado de TC de tamizaje de cáncer pulmonar: hasta seis nódulos o quistes atípicos con lóbulo, tipo, evolución y diámetros medios, la categoría Lung-RADS v2022 de cada uno (calculada, o asignada donde las reglas no dan ninguna), modificadores 4X y S, categoría 0 y manejo. No es un dispositivo médico."
"Opens a form: nodules with their type, behaviour since the prior exam and size; incomplete exam; S modifier. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = "Abre un formulario: nódulos con su tipo, evolución desde el examen previo y tamaño; examen incompleto; modificador S. La tabla del informe se actualiza con cada cambio; Copiar tabla la deja en el portapapeles. No lee píxeles."

