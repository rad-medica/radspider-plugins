# Translation template of the plugin org.radspider.lungrads: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"Lung-RADS report" = ""
"Structured lung cancer screening CT report: up to six nodules or atypical cysts with lobe, type, behaviour and mean diameters, the Lung-RADS v2022 category of each (computed, or assigned where the rules give none), 4X and S modifiers, category 0 and management. Not a medical device." = ""
"Opens a form: nodules with their type, behaviour since the prior exam and size; incomplete exam; S modifier. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = ""

