# MONAI model zoo bundle wholeBody_ct_segmentation (SegResNet, 104 structures; Apache-2.0).
id = "org.radspider.monai-wholebody"
name = "MONAI whole body CT"
version = "1.0.0"
api = 2
description = "104 anatomical structures on CT with the MONAI wholeBody_ct_segmentation bundle."
requirements = "requirements.txt"

[[segmentation]]
name = "wholebody"
label = "MONAI: whole body CT (104 structures)"
description = """CT only. Organs, vertebrae, ribs, heart chambers, vessels, bones, muscles. 3 mm is fast and light; 1.5 mm is the \
bundle's default and needs several GB of RAM on a full-body CT. The first run downloads the weights (71 MB, Hugging Face)."""
params = [
  { name = "highres", label = "Resolution: 1 = 1.5 mm, 0 = 3 mm", default = 0.0, min = 0.0, max = 1.0 },
  { name = "overlap", label = "Window overlap", default = 0.25, min = 0.0, max = 0.75 },
]
