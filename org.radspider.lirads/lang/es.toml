# LI-RADS report: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"LI-RADS report" = "Informe LI-RADS"
"Structured liver CT/MRI report for patients at high risk for HCC: observations drawn on a Couinaud schematic (segment from where they sit) with size and major features, the LI-RADS v2018 category (diagnostic table and ancillary features, or the reader's LR-NC, LR-TIV, LR-1, LR-2, LR-M) and its management. Not a medical device." = "Informe estructurado de TC/RM hepática para pacientes con alto riesgo de CHC: observaciones dibujadas sobre un esquema de Couinaud (el segmento sale de dónde quedan) con tamaño y características mayores, la categoría LI-RADS v2018 (tabla diagnóstica y características auxiliares, o la LR-NC, LR-TIV, LR-1, LR-2, LR-M del lector) y su manejo. No es un dispositivo médico."
"Opens a liver schematic: drag on a segment to draw an observation, then describe the selected one (features or category); exam and risk population above. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = "Abre un esquema hepático: arrastre sobre un segmento para dibujar una observación y describa la seleccionada (características o categoría); examen y población de riesgo arriba. La tabla del informe se actualiza con cada cambio; Copiar tabla la deja en el portapapeles. No lee píxeles."

# lirads.py
"CT" = "TC"
"MRI with extracellular contrast" = "RM con contraste extracelular"
"MRI with hepatobiliary contrast" = "RM con contraste hepatobiliar"
"Diagnostic table" = "Tabla diagnóstica"
"LR-NC: not categorizable (image degradation or omission)" = "LR-NC: no categorizable (degradación u omisión de imágenes)"
"LR-TIV: tumour in vein" = "LR-TIV: tumor en vena"
"LR-1: definitely benign" = "LR-1: definitivamente benigno"
"LR-2: probably benign" = "LR-2: probablemente benigno"
"LR-M: probably or definitely malignant, not HCC specific" = "LR-M: probable o definitivamente maligno, no específico de CHC"
"No arterial phase hyperenhancement" = "Sin hiperrealce en fase arterial"
"Nonrim arterial phase hyperenhancement" = "Hiperrealce en fase arterial no periférico (no en anillo)"
"Nonperipheral washout" = "Lavado no periférico"
"Enhancing capsule" = "Cápsula con realce"
"Threshold growth" = "Crecimiento umbral"
"No ancillary features" = "Sin características auxiliares"
"Ancillary features favouring malignancy" = "Características auxiliares a favor de malignidad"
"Ancillary features favouring benignity" = "Características auxiliares a favor de benignidad"
"Ancillary features favouring both (no adjustment)" = "Características auxiliares a favor de ambas (sin ajuste)"
"LR-NC: not categorizable" = "LR-NC: no categorizable"
"Repeat or alternative diagnostic imaging in 3 months or less" = "Repetir imagen diagnóstica o usar otra modalidad en 3 meses o menos"
"Return to surveillance in 6 months" = "Volver a vigilancia en 6 meses"
"Return to surveillance in 6 months; consider repeat diagnostic imaging in 6 months or less" = "Volver a vigilancia en 6 meses; considerar repetir imagen diagnóstica en 6 meses o menos"
"LR-3: intermediate probability of malignancy" = "LR-3: probabilidad intermedia de malignidad"
"Repeat or alternative diagnostic imaging in 3 to 6 months" = "Repetir imagen diagnóstica o usar otra modalidad en 3 a 6 meses"
"LR-4: probably HCC" = "LR-4: probablemente CHC"
"Multidisciplinary discussion for tailored workup, which may include biopsy" = "Discusión multidisciplinaria para un estudio individualizado, que puede incluir biopsia"
"LR-5: definitely HCC" = "LR-5: definitivamente CHC"
"Multidisciplinary discussion for consensus management" = "Discusión multidisciplinaria para manejo consensuado"
"Multidisciplinary discussion for tailored workup, which often includes biopsy" = "Discusión multidisciplinaria para un estudio individualizado, que a menudo incluye biopsia"
"Largest diameter" = "Diámetro mayor"
"Arterial phase" = "Fase arterial"
"Additional major features" = "Características mayores adicionales"
"None" = "Ninguna"
"Ancillary features" = "Características auxiliares"
"LI-RADS" = "LI-RADS"
"Not assigned" = "Sin asignar"
"Management" = "Manejo"
"Largest diameter (mm)" = "Diámetro mayor (mm)"
"Category" = "Categoría"
"Enter the size: the diagnostic table needs it." = "Ingrese el tamaño: la tabla diagnóstica lo necesita."
"Patient's right on the left; horizontal lines: portal plane" = "Derecha del paciente a la izquierda; líneas horizontales: plano portal"
"Exam" = "Examen"
"Observation {n}" = "Observación {n}"
"Segment" = "Segmento"
"Not applicable: the patient is not in the LI-RADS population" = "No aplica: el paciente no pertenece a la población LI-RADS"
"Observations" = "Observaciones"
"Most worrying observation" = "Observación más preocupante"
"Not assigned: an observation has no category yet" = "Sin asignar: una observación aún no tiene categoría"
"Comment" = "Comentario"
"Patient at high risk for HCC (cirrhosis, chronic hepatitis B, current or prior HCC)" = "Paciente de alto riesgo de CHC (cirrosis, hepatitis B crónica, CHC actual o previo)"
"Liver segments (Couinaud)" = "Segmentos hepáticos (Couinaud)"
"Drag on the liver to draw an observation; click a mark to describe it." = "Arrastre sobre el hígado para dibujar una observación; haga clic en una marca para describirla."
"A mark outside the liver is not reported: move it or delete it." = "Una marca fuera del hígado no se informa: muévala o bórrela."
"Outside the schematic" = "Fuera del esquema"
"Segment {s}" = "Segmento {s}"
"Delete" = "Borrar"
"Report" = "Informe"
"LI-RADS CT/MRI v2018 diagnostic algorithm. LR-NC, LR-TIV, LR-1, LR-2 and LR-M are the reader's call before the table; treated observations (LR-TR) are not covered. Not a medical device: check every line before signing." = "Algoritmo diagnóstico LI-RADS TC/RM v2018. LR-NC, LR-TIV, LR-1, LR-2 y LR-M los decide el lector antes de la tabla; las observaciones tratadas (LR-TR) no están cubiertas. No es un dispositivo médico: revise cada línea antes de firmar."
