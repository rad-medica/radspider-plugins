# Translation template of the plugin org.radspider.lirads: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"LI-RADS report" = ""
"Structured liver CT/MRI report for patients at high risk for HCC: observations drawn on a Couinaud schematic (segment from where they sit) with size and major features, the LI-RADS v2018 category (diagnostic table and ancillary features, or the reader's LR-NC, LR-TIV, LR-1, LR-2, LR-M) and its management. Not a medical device." = ""
"Opens a liver schematic: drag on a segment to draw an observation, then describe the selected one (features or category); exam and risk population above. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = ""

