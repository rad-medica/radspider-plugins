# Volume tools: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"Volume tools" = "Herramientas de volumen"
"Invert, scale / normalize to a region, ΔR2 map of two series, tag grid from two tagged series, rigid mutual-information registration." = "Invertir, escalar / normalizar a una región, mapa de ΔR2 de dos series, rejilla de marcado a partir de dos series marcadas y registro rígido por información mutua."
"Invert Data" = "Invertir datos"
"Negates every voxel (x → −x). No data stays no data." = "Cambia el signo de cada vóxel (x → −x). Lo que no tiene datos sigue sin datos."
"Scale" = "Escalar"
"Multiplies every voxel by a factor: the second step of Normalize (the tool reports the factor)." = "Multiplica cada vóxel por un factor: el segundo paso de Normalizar (la herramienta indica el factor)."
"Factor" = "Factor"
"Normalize" = "Normalizar"
"Mean inside a closed measurement (polygon, ellipse) or a segment, and the factor that brings it to the target. Apply the factor with the Scale node of the series builder." = "Media dentro de una medición cerrada (polígono, elipse) o de un segmento, y el factor que la lleva al objetivo. Aplique el factor con el nodo Escalar del constructor de series."
"Target mean" = "Media objetivo"
"Segment number (0 = measurement)" = "Número de segmento (0 = medición)"
"T2 Ratio Map" = "Mapa de razón T2"
"ΔR2 = −(factor / TE) · ln(second / active) per voxel: active series = pre-contrast, second series = post-contrast. Returns the map, its statistics and a histogram." = "ΔR2 = −(factor / TE) · ln(segunda / activa) por vóxel: serie activa = precontraste, segunda serie = poscontraste. Devuelve el mapa, sus estadísticas y un histograma."
"TE (ms)" = "TE (ms)"
"Intensity threshold" = "Umbral de intensidad"
"Multiplication factor" = "Factor de multiplicación"
"Region (0 = auto, −1 = whole volume, n = segment n)" = "Región (0 = automática, −1 = todo el volumen, n = segmento n)"
"Cardiac Tagging MRI" = "RM de marcado cardíaco (tagging)"
"Multiplies two tagged series (horizontal and vertical tag lines) into one grid-tagged series." = "Multiplica dos series marcadas (líneas de marcado horizontales y verticales) para obtener una serie con rejilla de marcado."
"Equalize slice maxima" = "Igualar los máximos de los cortes"
"PetSpectFusion" = "PetSpectFusion"
"Rigid registration (3 rotations, 3 translations) of the second series onto the active one by mutual information on a multi-resolution pyramid; returns it on the active series' grid." = "Registro rígido (3 rotaciones, 3 traslaciones) de la segunda serie sobre la activa por información mutua en una pirámide multirresolución; la devuelve en la malla de la serie activa."
"Pyramid levels" = "Niveles de la pirámide"
"Histogram bins" = "Intervalos del histograma"
"Samples per level (thousands)" = "Muestras por nivel (miles)"
"Start" = "Inicio"
"auto" = "automático"
"centres of mass" = "centros de masa"

