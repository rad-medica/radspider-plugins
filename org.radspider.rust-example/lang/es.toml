# Rust example: Español (es). Made from template.toml (radspider-check --plugin-template <plugin dir> --ids tr-ids.txt).

[language]
name = "Español"

[strings]

# plugin.toml
"Rust example" = "Ejemplo en Rust"
"One entry of each kind written in Rust: a native plugin, no Python." = "Una entrada de cada tipo escrita en Rust: un plugin nativo, sin Python."
"Window clip" = "Recorte de ventana"
"Values outside [lo, hi] become no data (NaN)." = "Los valores fuera de [lo, hi] pasan a ser sin datos (NaN)."
"Threshold" = "Umbral"
"Label 1: voxels at or above the threshold." = "Etiqueta 1: vóxeles en el umbral o por encima."
"Volume statistics" = "Estadísticas del volumen"
"Count, mean, minimum, maximum and the volume of voxels with data." = "Recuento, media, mínimo, máximo y volumen de los vóxeles con datos."

# tr-ids.txt
"Statistic" = "Estadístico"
"Value" = "Valor"
"Voxels with data" = "Vóxeles con datos"
"Mean {unit}" = "Media {unit}"
"Minimum {unit}" = "Mínimo {unit}"
"Maximum {unit}" = "Máximo {unit}"
"Volume (ml)" = "Volumen (ml)"
"{n} voxel" = { one = "{n} vóxel", other = "{n} vóxeles" }
