# Translation template of the plugin org.radspider.roi-tools: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"ROI tools" = ""
"Ten measurement tools: Cobb angle, ROI export, ROI rotation, points to line, sphere volumes, ROIs to segments, sector statistics, point counting, region growing from a probe, calcium score." = ""
"Cobb angle" = ""
"The angle between the two most recent lines on the slice on screen (0–90° and its supplement), added as a Cobb measurement." = ""
"Export ROIs" = ""
"Every measurement of the series as one table: kind, image, points in voxels and patient mm, length, area, perimeter and, for polygons and ellipses, mean, SD, min, max of the pixels inside. Save as CSV… writes it." = ""
"Rotate ROI" = ""
"Rotates the most recent polygon or line on the slice on screen (or all of them) about its centroid, in mm. Positive = counter-clockwise on screen." = ""
"Angle (°)" = ""
"All on the slice" = ""
"Points to line" = ""
"Joins the probes placed on different slices, in slice order: every slice in between gets a probe at the linearly interpolated position." = ""
"Sphere volumes" = ""
"The two most recent lines as diameters of spheres (π·d³/6): both volumes in ml, the change in ml and %, and the ratio." = ""
"ROIs to segments" = ""
"Rasterises the polygons and ellipses of all slices into segments, one per name (a text note inside a shape names it; otherwise by kind), with voxel counts and ml." = ""
"Sector statistics" = ""
"The wall between two polygons on the slice on screen (larger = epicardial, smaller = endocardial) split into angular sectors and radial layers about the endocardial centroid: mean, SD, min, max, area of each, a chart, and the sector outlines." = ""
"Sectors" = ""
"Layers" = ""
"Reference angle (°)" = ""
"Add outlines" = ""
"Count points" = ""
"Counts probes and text notes by type (a note's text), per image and in total, with the density per mm of the lines drawn on the image." = ""
"Grow from probe" = ""
"3D region growing (6-connected) from the most recent probe. Mode “Seed value ± range”: seed value − Lower … + Upper; “Absolute bounds”: Lower … Upper as absolute values; “% of local maximum”: Lower % of the maximum within the search box … that maximum. One segment, with its volume." = ""
"Mode" = ""
"Seed value ± range" = ""
"Absolute bounds" = ""
"% of local maximum" = ""
"Lower" = ""
"Upper" = ""
"Search box (mm, for % of local maximum)" = ""
"Calcium score" = ""
"Agatston score of a non-contrast cardiac CT (HU only): lesions ≥ 130 HU per slice, weighted by peak HU, scaled by slice spacing / 3 mm; volume score and lesion count. Inside the existing segments when there are any, else the whole volume (bone is counted)." = ""
"Smallest lesion (mm²)" = ""

