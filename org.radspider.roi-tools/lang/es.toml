# ROI tools: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"ROI tools" = "Herramientas ROI"
"Ten measurement tools: Cobb angle, ROI export, ROI rotation, points to line, sphere volumes, ROIs to segments, sector statistics, point counting, region growing from a probe, calcium score." = "Diez herramientas de medida: ángulo de Cobb, exportación de ROI, rotación de ROI, de puntos a línea, volúmenes de esfera, de ROI a segmentos, estadísticas por sectores, recuento de puntos, crecimiento de región desde una sonda y puntuación de calcio."
"Cobb angle" = "Ángulo de Cobb"
"The angle between the two most recent lines on the slice on screen (0–90° and its supplement), added as a Cobb measurement." = "El ángulo entre las dos últimas líneas del corte en pantalla (0–90° y su suplementario), añadido como medida de Cobb."
"Export ROIs" = "Exportar ROI"
"Every measurement of the series as one table: kind, image, points in voxels and patient mm, length, area, perimeter and, for polygons and ellipses, mean, SD, min, max of the pixels inside. Save as CSV… writes it." = "Todas las medidas de la serie en una tabla: tipo, imagen, puntos en vóxeles y en mm del paciente, longitud, área, perímetro y, en polígonos y elipses, media, DE, mínimo y máximo de los píxeles del interior. Guardar como CSV… la escribe."
"Rotate ROI" = "Rotar ROI"
"Rotates the most recent polygon or line on the slice on screen (or all of them) about its centroid, in mm. Positive = counter-clockwise on screen." = "Gira el último polígono o línea del corte en pantalla (o todos) alrededor de su centroide, en mm. Positivo = sentido antihorario en pantalla."
"Angle (°)" = "Ángulo (°)"
"All on the slice" = "Todos en el corte"
"Points to line" = "Puntos a línea"
"Joins the probes placed on different slices, in slice order: every slice in between gets a probe at the linearly interpolated position." = "Une las sondas colocadas en distintos cortes, en orden de corte: cada corte intermedio recibe una sonda en la posición interpolada linealmente."
"Sphere volumes" = "Volúmenes de esfera"
"The two most recent lines as diameters of spheres (π·d³/6): both volumes in ml, the change in ml and %, and the ratio." = "Las dos últimas líneas como diámetros de esferas (π·d³/6): ambos volúmenes en ml, el cambio en ml y en %, y la razón."
"ROIs to segments" = "ROI a segmentos"
"Rasterises the polygons and ellipses of all slices into segments, one per name (a text note inside a shape names it; otherwise by kind), with voxel counts and ml." = "Rasteriza los polígonos y elipses de todos los cortes en segmentos, uno por nombre (una nota de texto dentro de la forma le da nombre; si no, el tipo), con recuento de vóxeles y ml."
"Sector statistics" = "Estadísticas por sectores"
"The wall between two polygons on the slice on screen (larger = epicardial, smaller = endocardial) split into angular sectors and radial layers about the endocardial centroid: mean, SD, min, max, area of each, a chart, and the sector outlines." = "La pared entre dos polígonos del corte en pantalla (el mayor = epicárdico, el menor = endocárdico) dividida en sectores angulares y capas radiales alrededor del centroide endocárdico: media, DE, mínimo, máximo y área de cada uno, un gráfico y los contornos de los sectores."
"Sectors" = "Sectores"
"Layers" = "Capas"
"Reference angle (°)" = "Ángulo de referencia (°)"
"Add outlines" = "Añadir contornos"
"Count points" = "Contar puntos"
"Counts probes and text notes by type (a note's text), per image and in total, with the density per mm of the lines drawn on the image." = "Cuenta sondas y notas de texto por tipo (el texto de la nota), por imagen y en total, con la densidad por mm de las líneas dibujadas en la imagen."
"Grow from probe" = "Crecer desde sonda"
"3D region growing (6-connected) from the most recent probe. Mode “Seed value ± range”: seed value − Lower … + Upper; “Absolute bounds”: Lower … Upper as absolute values; “% of local maximum”: Lower % of the maximum within the search box … that maximum. One segment, with its volume." = "Crecimiento de región 3D (conectividad 6) desde la última sonda. Modo «Valor de la semilla ± rango»: valor de la semilla − Inferior … + Superior; «Límites absolutos»: Inferior … Superior como valores absolutos; «% del máximo local»: Inferior % del máximo dentro del cuadro de búsqueda … ese máximo. Un segmento, con su volumen."
"Mode" = "Modo"
"Seed value ± range" = "Valor de la semilla ± rango"
"Absolute bounds" = "Límites absolutos"
"% of local maximum" = "% del máximo local"
"Lower" = "Inferior"
"Upper" = "Superior"
"Search box (mm, for % of local maximum)" = "Cuadro de búsqueda (mm, para % del máximo local)"
"Calcium score" = "Puntuación de calcio"
"Agatston score of a non-contrast cardiac CT (HU only): lesions ≥ 130 HU per slice, weighted by peak HU, scaled by slice spacing / 3 mm; volume score and lesion count. Inside the existing segments when there are any, else the whole volume (bone is counted)." = "Puntuación de Agatston de una TC cardíaca sin contraste (solo HU): lesiones ≥ 130 HU por corte, ponderadas por el pico de HU y escaladas por el espesor de corte / 3 mm; puntuación de volumen y número de lesiones. Dentro de los segmentos existentes si los hay; si no, en todo el volumen (se cuenta el hueso)."
"Smallest lesion (mm²)" = "Lesión más pequeña (mm²)"

