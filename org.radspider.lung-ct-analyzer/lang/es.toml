# Lung CT analyzer: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"Lung CT analyzer" = "Analizador de TC pulmonar"
"Lung volumes by density on CT: emphysema, inflated, infiltrated, collapsed, vessels per lung, functional and affected volume. Lung masks without AI." = "Volúmenes pulmonares por densidad en TC: enfisema, insuflado, infiltrado, colapsado y vasos por pulmón, volumen funcional y afectado. Máscaras pulmonares sin IA."
"Lungs (threshold, no AI)" = "Pulmones (umbral, sin IA)"
"CT in HU only. Right lung, left lung and trachea from the air inside the body below the threshold: connected components, airway tracked down from the top slices, lungs split, holes closed, outline smoothed." = "Solo TC en UH. Pulmón derecho, pulmón izquierdo y tráquea a partir del aire dentro del cuerpo por debajo del umbral: componentes conexos, vía aérea seguida desde los cortes superiores, pulmones separados, huecos cerrados y contorno suavizado."
"Lung threshold (HU, below = air)" = "Umbral pulmonar (UH, por debajo = aire)"
"Close holes: kernel (mm, 0 = off)" = "Cerrar huecos: núcleo (mm, 0 = desactivado)"
"Smooth outline: Gaussian SD (mm, 0 = off)" = "Suavizar contorno: DE gaussiana (mm, 0 = desactivado)"
"Trachea segment" = "Segmento de tráquea"
"Lung CT analysis" = "Análisis de TC pulmonar"
"CT in HU only. Uses the segments named right / left lung (or lung lobes) when the series has them, otherwise makes the lung masks by thresholding. Table of volumes in ml and % per lung, bar chart, one segment per class and lung. The four parameters are the HU limits between the classes; they can be changed in the window." = "Solo TC en UH. Usa los segmentos llamados pulmón derecho / izquierdo (o lóbulos pulmonares) cuando la serie los tiene; si no, crea las máscaras pulmonares por umbral. Tabla de volúmenes en ml y % por pulmón, gráfico de barras y un segmento por clase y pulmón. Los cuatro parámetros son los límites en UH entre las clases; se pueden cambiar en la ventana."
"Emphysema below (HU)" = "Enfisema por debajo de (UH)"
"Inflated below (HU)" = "Insuflado por debajo de (UH)"
"Infiltrated below (HU)" = "Infiltrado por debajo de (UH)"
"Collapsed below (HU), vessels from" = "Colapsado por debajo de (UH), vasos desde"

# plugin.py
"Body outline" = "Contorno corporal"
"Airways" = "Vías aéreas"
"Splitting the lungs" = "Separando los pulmones"
"Closing and smoothing" = "Cerrando y suavizando"
"Lung masks: segment {names} split in two. Not clinically evaluated: do not base treatment decisions on these values." = "Máscaras pulmonares: segmento {names} dividido en dos. No evaluado clínicamente: no base decisiones de tratamiento en estos valores."
"Lung masks: segments {names}. Not clinically evaluated: do not base treatment decisions on these values." = "Máscaras pulmonares: segmentos {names}. No evaluado clínicamente: no base decisiones de tratamiento en estos valores."
"Lung masks: made by thresholding (the series has no segment named right / left lung or lobe). Not clinically evaluated: do not base treatment decisions on these values." = "Máscaras pulmonares: creadas por umbral (la serie no tiene ningún segmento llamado pulmón o lóbulo derecho / izquierdo). No evaluado clínicamente: no base decisiones de tratamiento en estos valores."
"Classifying" = "Clasificando"
"Lung area" = "Zona pulmonar"
"Total (ml)" = "Total (ml)"
"Functional (ml)" = "Funcional (ml)"
"Functional (%)" = "Funcional (%)"
"Emphysema (ml)" = "Enfisema (ml)"
"Emphysema (%)" = "Enfisema (%)"
"Inflated (ml)" = "Insuflado (ml)"
"Inflated (%)" = "Insuflado (%)"
"Infiltrated (ml)" = "Infiltrado (ml)"
"Infiltrated (%)" = "Infiltrado (%)"
"Collapsed (ml)" = "Colapsado (ml)"
"Collapsed (%)" = "Colapsado (%)"
"Affected (ml)" = "Afectado (ml)"
"Affected (%)" = "Afectado (%)"
"Vessels (ml)" = "Vasos (ml)"
"AF-Q (affected / functional)" = "AF-Q (afectado / funcional)"
"Total lungs" = "Pulmones totales"
"Right lung" = "Pulmón derecho"
"Left lung" = "Pulmón izquierdo"
"Volume per class" = "Volumen por clase"
"1 emphysema, 2 inflated, 3 infiltrated, 4 collapsed, 5 vessels" = "1 enfisema, 2 insuflado, 3 infiltrado, 4 colapsado, 5 vasos"
"ml" = "ml"
"Density inside the lung masks" = "Densidad dentro de las máscaras pulmonares"
"Voxels" = "Vóxeles"
"HU (10 HU bins)" = "UH (intervalos de 10 UH)"
"Collapsed below (HU)" = "Colapsado por debajo de (UH)"
