name: native plugins

# Builds every native (Rust) plugin — a folder with Cargo.toml — for Windows x86_64, Linux x86_64 (static, musl) and
# macOS aarch64 and commits the executables to <plugin>/bin/<os>-<arch>/. A plugin whose executables changed gets a
# patch bump in the same commit (a published version is immutable, and Release may already have published the
# source commit's version), the index is regenerated, and on main Release is dispatched for the new version: a push
# made with GITHUB_TOKEN starts no workflow by itself. Needs the secret RADSPIDER_READ_TOKEN: the SDK crate is in the
# private radspider repository, checked out beside this one as the plugins' Cargo.toml expect (../radspider).

on:
  workflow_dispatch:
    inputs:
      radspider_ref:
        description: radspider branch, tag or commit whose SDK to build against
        default: main
  push:
    paths:
      - "org.radspider.*/src/**"
      - "org.radspider.*/Cargo.toml"
      - "org.radspider.*/Cargo.lock"

concurrency:
  group: native-plugins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.dir }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, dir: windows-x86_64, target: x86_64-pc-windows-msvc, exe: ".exe" }
          - { os: ubuntu-latest, dir: linux-x86_64, target: x86_64-unknown-linux-musl, exe: "" }
          - { os: macos-latest, dir: macos-aarch64, target: aarch64-apple-darwin, exe: "" }
    defaults:
      run:
        shell: bash
    steps:
      - name: Token for the radspider SDK
        env:
          RADSPIDER_READ_TOKEN: ${{ secrets.RADSPIDER_READ_TOKEN }}
        run: |
          if [ -z "$RADSPIDER_READ_TOKEN" ]; then
            echo "::error::secret RADSPIDER_READ_TOKEN is not set: native plugins cannot be built (see SECURITY.md)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          path: radspider-plugins

      - uses: actions/checkout@v7
        with:
          repository: rad-medica/radspider
          ref: ${{ inputs.radspider_ref || 'main' }}
          token: ${{ secrets.RADSPIDER_READ_TOKEN }}
          path: radspider
          sparse-checkout: |
            crates/radspider-plugin
            LICENSE

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build every native plugin
        working-directory: radspider-plugins
        run: |
          set -euo pipefail
          mkdir -p ../out
          for manifest in org.radspider.*/Cargo.toml; do
            plugin=$(dirname "$manifest")
            command=$(python -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['command'])" "$plugin/plugin.toml")
            cargo build --release --locked --manifest-path "$manifest" --target ${{ matrix.target }}
            mkdir -p "../out/$plugin/bin/${{ matrix.dir }}"
            cp "$plugin/target/${{ matrix.target }}/release/$command${{ matrix.exe }}" "../out/$plugin/bin/${{ matrix.dir }}/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.dir }}
          path: out
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: out

      - name: Put the executables in place, bump changed plugins, regenerate the index
        run: |
          set -euo pipefail
          for d in out/bin-*/; do cp -R "$d". .; done
          git add -A org.radspider.*/bin
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          changed = subprocess.run(["git", "diff", "--cached", "--name-only", "--", "org.radspider.*/bin"],
                                   capture_output=True, text=True, check=True).stdout.split()
          for plugin in sorted({Path(f).parts[0] for f in changed}):
              manifest = Path(plugin) / "plugin.toml"
              text = manifest.read_text(encoding="utf-8")
              m = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', text, re.M)
              new = f"{m[1]}.{m[2]}.{int(m[3]) + 1}"
              manifest.write_text(text[:m.start()] + f'version = "{new}"' + text[m.end():], encoding="utf-8", newline="\n")
              print(f"{plugin}: {m[1]}.{m[2]}.{m[3]} -> {new}")
          PY
          python tools/marketplace.py update
          python tools/validate_plugins.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git add org.radspider.*/bin org.radspider.*/plugin.toml marketplace/index.json
          if git diff --cached --quiet; then
            echo "executables already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Native plugins: executables for Windows, Linux and macOS (patch bump)"
          git push
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            gh workflow run release.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
