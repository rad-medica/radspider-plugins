# TI-RADS structured thyroid report: ACR TI-RADS points per nodule, cervical lymph node map, optional clinical TNM.
id = "org.radspider.tirads"
name = "TI-RADS report"
version = "2.0.0"
api = 8                        # 8: sketch (nodules and nodes drawn on a schematic); 6: input = "image", windows
icon = "clipboard-text"
description = "Structured thyroid ultrasound report: nodules and lymph nodes drawn on a neck schematic; nodules scored with ACR TI-RADS (points, level, FNA or follow-up by size), lymph nodes classed by level and side (ETA 2013), optional clinical TNM stage of differentiated carcinoma (AJCC 8th edition). Not a medical device."
module = "tirads"

[[tool]]
name = "report"
label = "TI-RADS report"
description = "Opens a neck schematic: drag on a lobe to draw a nodule or in a level to draw a lymph node, then describe the selected one; staging below. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data."
icon = "clipboard-text"
# An image tool only because a tool must run on something: one image costs far less per change than a whole volume.
input = "image"
window = { title = "TI-RADS report", width = 560, height = 900, reuse = true }
