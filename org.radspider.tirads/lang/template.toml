# Translation template of the plugin org.radspider.tirads: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"TI-RADS report" = ""
"Structured thyroid ultrasound report: nodules and lymph nodes drawn on a neck schematic; nodules scored with ACR TI-RADS (points, level, FNA or follow-up by size), lymph nodes classed by level and side (ETA 2013), optional clinical TNM stage of differentiated carcinoma (AJCC 8th edition). Not a medical device." = ""
"Opens a neck schematic: drag on a lobe to draw a nodule or in a level to draw a lymph node, then describe the selected one; staging below. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = ""

