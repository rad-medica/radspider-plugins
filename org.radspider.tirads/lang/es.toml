# TI-RADS report: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"TI-RADS report" = "Informe TI-RADS"
"Structured thyroid ultrasound report: up to four nodules scored with ACR TI-RADS (points, level, FNA or follow-up by size), cervical lymph nodes by level and side, optional clinical TNM stage of differentiated carcinoma (AJCC 8th edition). Not a medical device." = "Informe estructurado de ecografía tiroidea: hasta cuatro nódulos puntuados con ACR TI-RADS (puntos, nivel, PAAF o control según tamaño), linfonodos cervicales por grupo y lado, etapificación TNM clínica opcional del carcinoma diferenciado (AJCC 8.ª edición). No es un dispositivo médico."
"Opens a form: nodules with their ACR TI-RADS features, the lymph node map of the neck and the staging. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = "Abre un formulario: nódulos con sus características ACR TI-RADS, el mapa de linfonodos del cuello y la etapificación. La tabla del informe se actualiza con cada cambio; Copiar tabla la deja en el portapapeles. No lee píxeles."

