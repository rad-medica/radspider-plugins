# TI-RADS report: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"TI-RADS report" = "Informe TI-RADS"
"Structured thyroid ultrasound report: nodules and lymph nodes drawn on a neck schematic; nodules scored with ACR TI-RADS (points, level, FNA or follow-up by size), lymph nodes classed by level and side (ETA 2013), optional clinical TNM stage of differentiated carcinoma (AJCC 8th edition). Not a medical device." = "Informe estructurado de ecografía tiroidea: nódulos y linfonodos dibujados sobre un esquema del cuello; nódulos puntuados con ACR TI-RADS (puntos, nivel, PAAF o control según tamaño), linfonodos clasificados por grupo y lado (ETA 2013), etapificación TNM clínica opcional del carcinoma diferenciado (AJCC 8.ª edición). No es un dispositivo médico."
"Opens a neck schematic: drag on a lobe to draw a nodule or in a level to draw a lymph node, then describe the selected one; staging below. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = "Abre un esquema del cuello: arrastre sobre un lóbulo para dibujar un nódulo o dentro de un grupo para dibujar un linfonodo, y describa el seleccionado; la etapificación va debajo. La tabla del informe se actualiza con cada cambio; Copiar tabla la deja en el portapapeles. No lee píxeles."

