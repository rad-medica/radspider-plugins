# Translation template of the plugin org.radspider.sam: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"SAM" = ""
"Click-prompted segmentation: SAM ViT-B (ONNX) on single slices with slice propagation, SAM-Med3D on a 3D window, and the bidirectional measurement of segments." = ""
"SAM: segment from clicks (2D)" = ""
"Probe measurements are include markers, Text measurements reading '-' exclude markers, as in OHIF's prompt tool. Each slice that holds a Probe is segmented on that slice only. First run downloads the models (~190 MB, Hugging Face)." = ""
"Window centre (HU / value)" = ""
"Window width" = ""
"One segment per slice" = ""
"SAM: propagate a segment to neighbouring slices" = ""
"Takes a segment, and on each slice beyond its first and last it prompts SAM with random points of the neighbour's mask (OHIF's Labelmap Assist). Stops when a slice comes out empty. The result is a new segment holding the old voxels and the new ones." = ""
"Segment (1 = top of the list)" = ""
"Slices to add in each direction" = ""
"Window centre" = ""
"SAM-Med3D: segment from clicks (3D)" = ""
"Each Probe measurement on the series is a positive click. A Text measurement reading '-' is a negative click. Without Probes the run fails and says so. The first run downloads the checkpoint (~400 MB, Hugging Face)." = ""
"One segment per click" = ""
"Decoder passes (refinement)" = ""
"Probability threshold" = ""
"Bidirectional measurement of segments" = ""
"For every segment: the slice where it is largest, its longest diameter and the longest chord perpendicular to it, drawn as a bidimensional measurement (OHIF 3.10 'bidirectional measurement for segments'). No model." = ""

