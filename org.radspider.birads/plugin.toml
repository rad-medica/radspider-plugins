# BI-RADS structured breast report: lexicon descriptors per finding, the reader's categories, the overall assessment.
id = "org.radspider.birads"
name = "BI-RADS report"
version = "2.0.0"
api = 8                        # 8: sketch (findings drawn on the breasts); 6: input = "image", windows
icon = "clipboard-text"
description = "Structured breast imaging report with the BI-RADS lexicon (mammography, ultrasound, MRI): breast composition, findings drawn on a schematic of both breasts (breast and clock position from the drawing), the reader's assessment categories, the overall assessment with its management. Not a medical device."
module = "birads"

[[tool]]
name = "report"
label = "BI-RADS report"
description = "Opens a schematic of both breasts: drag on a breast to draw a finding, then describe the selected one with its descriptors and category; exam and composition above. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data."
icon = "clipboard-text"
# An image tool only because a tool must run on something: one image costs far less per change than a whole volume.
input = "image"
window = { title = "BI-RADS report", width = 560, height = 900, reuse = true }
