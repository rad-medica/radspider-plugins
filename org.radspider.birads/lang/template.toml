# Translation template of the plugin org.radspider.birads: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"BI-RADS report" = ""
"Structured breast imaging report with the BI-RADS lexicon (mammography, ultrasound, MRI): breast composition, up to four findings, the reader's assessment categories, the overall assessment with its management. Not a medical device." = ""
"Opens a form: exam, breast composition, findings with their descriptors and categories. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = ""

