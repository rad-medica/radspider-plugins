# BI-RADS report: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"BI-RADS report" = "Informe BI-RADS"
"Structured breast imaging report with the BI-RADS lexicon (mammography, ultrasound, MRI): breast composition, findings drawn on a schematic of both breasts (breast and clock position from the drawing), the reader's assessment categories, the overall assessment with its management. Not a medical device." = "Informe estructurado de imagen mamaria con el léxico BI-RADS (mamografía, ecografía, RM): composición mamaria, hallazgos dibujados sobre un esquema de ambas mamas (mama y posición horaria según el dibujo), las categorías de evaluación del lector, la evaluación global con su conducta. No es un dispositivo médico."
"Opens a schematic of both breasts: drag on a breast to draw a finding, then describe the selected one with its descriptors and category; exam and composition above. The report table updates on every change; Copy table puts it on the clipboard. Reads no pixel data." = "Abre un esquema de ambas mamas: arrastre sobre una mama para dibujar un hallazgo y describa el seleccionado con sus descriptores y categoría; examen y composición arriba. La tabla del informe se actualiza con cada cambio; Copiar tabla la deja en el portapapeles. No lee píxeles."

