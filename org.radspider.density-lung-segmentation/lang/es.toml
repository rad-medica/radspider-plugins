# Density lung segmentation: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"Density lung segmentation" = "Segmentación pulmonar por densidad"
"Lung tissue on CT by density with a fixed 5-class Gaussian mixture: air, healthy lung, ground glass opacity, consolidation, other denser tissues." = "Tejido pulmonar en TC según su densidad, con una mezcla gaussiana fija de 5 clases: aire, pulmón sano, opacidad en vidrio deslustrado, consolidación y otros tejidos más densos."
"Lung density classes (per voxel)" = "Clases de densidad pulmonar (por vóxel)"
"CT in HU only. Lung mask by threshold, islands and closing; each voxel inside gets the most likely of five density classes of a Gaussian mixture fitted on COVID-19 CTs." = "Solo TC en HU. Máscara pulmonar por umbral, islas y cierre; cada vóxel del interior recibe la más probable de las cinco clases de densidad de una mezcla gaussiana ajustada con TC de COVID-19."
"Lung threshold (HU, below = air)" = "Umbral pulmonar (HU, por debajo = aire)"
"Smallest lung island (voxels)" = "Isla pulmonar más pequeña (vóxeles)"
"Lung density classes (averaged)" = "Clases de densidad pulmonar (promediadas)"
"The same, followed by a 4 x 4 x 4 voxel median filter of the labels: fewer isolated voxels." = "Lo mismo, seguido de un filtro de mediana de 4 x 4 x 4 vóxeles sobre las etiquetas: menos vóxeles aislados."
"Lung density volumes" = "Volúmenes de densidad pulmonar"
"CT in HU only. The same segmentation with a table of volume in ml, share and mean HU per class, a bar chart and the segments." = "Solo TC en HU. La misma segmentación con una tabla de volumen en ml, proporción y HU medias por clase, un gráfico de barras y los segmentos."
"Averaged labels" = "Etiquetas promediadas"

# plugin.py
"Air" = "Aire"
"Healthy lungs" = "Pulmón sano"
"Ground glass opacity" = "Opacidad en vidrio deslustrado"
"Consolidation" = "Consolidación"
"Other denser tissues" = "Otros tejidos más densos"
"Threshold and opening" = "Umbral y apertura"
"Islands" = "Islas"
"Closing, {radius} voxels" = "Cierre, {radius} vóxeles"
"Mixture classes" = "Clases de la mezcla"
"Median filter" = "Filtro de mediana"
"Class" = "Clase"
"Volume (ml)" = "Volumen (ml)"
"Share of the lung mask (%)" = "Proporción de la máscara pulmonar (%)"
"Mean HU" = "HU media"
"Lung mask" = "Máscara pulmonar"
"Volume per class" = "Volumen por clase"
"Volume" = "Volumen"
"1 air, 2 healthy lungs, 3 ground glass opacity, 4 consolidation, 5 other denser tissues" = "1 aire, 2 pulmón sano, 3 opacidad en vidrio deslustrado, 4 consolidación, 5 otros tejidos más densos"
"ml" = "ml"
"Averaged labels. The lung mask is closed with 30 and 20 voxel balls, so it holds vessels, hila and part of the mediastinum (class 5). Not clinically evaluated." = "Etiquetas promediadas. La máscara pulmonar se cierra con esferas de 30 y 20 vóxeles, por lo que incluye vasos, hilios y parte del mediastino (clase 5). Sin evaluación clínica."
"Per-voxel labels. The lung mask is closed with 30 and 20 voxel balls, so it holds vessels, hila and part of the mediastinum (class 5). Not clinically evaluated." = "Etiquetas por vóxel. La máscara pulmonar se cierra con esferas de 30 y 20 vóxeles, por lo que incluye vasos, hilios y parte del mediastino (clase 5). Sin evaluación clínica."
