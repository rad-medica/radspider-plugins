"Model (MR): dcm-classifier, a random forest over 28 header values trained on brain MR, gives a second opinion on the sequence class. It is not ground truth: when it differs from the rules, either may be wrong." = "Modelo (RM): dcm-classifier, un bosque aleatorio sobre 28 valores de la cabecera entrenado con RM de encéfalo, da una segunda opinión sobre el tipo de secuencia. No es una referencia absoluta: cuando difiere de las reglas, cualquiera de los dos puede estar equivocado."
