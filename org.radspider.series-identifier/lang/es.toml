# Series identifier: Español (es). Made from lang/template.toml (python tools/series_identifier_template.py),
# same keys in the same order; tools/test_series_identifier.py checks that both list every text the plugin shows.

[language]
name = "Español"

[strings]

# plugin.toml
"Series identifier" = "Identificador de series"
"Says what the series on screen is, its plane or projection, and explains both. Rules over DICOM tags for every modality; dcm-classifier (Apache-2.0) as a second opinion on MR." = "Indica qué serie hay en pantalla, su plano o proyección, y explica ambos. Reglas sobre etiquetas DICOM para todas las modalidades; dcm-classifier (Apache-2.0) como segunda opinión en RM."
"Identify series" = "Identificar serie"
"Runs on the image on screen: series type, plane or projection, region, laterality and contrast, each with the tag values that decided it and a short explanation. On MR, a second opinion from the dcm-classifier model. Educational aid; not for diagnosis." = "Se ejecuta sobre la imagen en pantalla: tipo de serie, plano o proyección, región, lateralidad y contraste, cada uno con los valores de etiqueta que lo decidieron y una breve explicación. En RM, una segunda opinión del modelo dcm-classifier. Ayuda didáctica; no apta para diagnóstico."

