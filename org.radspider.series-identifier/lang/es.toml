"Axial slices are horizontal cuts through the body, viewed as if from the feet. Most CT and MR series are acquired or shown in this plane." = "Los cortes axiales son secciones horizontales del cuerpo, vistas como desde los pies. La mayoría de las series de TC y RM se adquieren o se muestran en este plano."
"Coronal slices are vertical cuts from front to back, so the image faces you like a person standing in front of you." = "Los cortes coronales son secciones verticales que se suceden de delante atrás, de modo que la imagen le mira de frente como una persona de pie ante usted."
"Sagittal slices are vertical cuts from left to right, showing the body in side view. They are often used for the spine and the midline of the brain." = "Los cortes sagitales son secciones verticales que se suceden de izquierda a derecha y muestran el cuerpo de perfil. Se usan a menudo para la columna y la línea media del encéfalo."
"The slices are tilted away from the standard planes; the nearest one is axial, at the angle shown. Tilted slices are used to follow a structure or come from gantry tilt." = "Los cortes están inclinados respecto a los planos estándar; el más próximo es el axial, con el ángulo indicado. Los cortes inclinados se usan para seguir una estructura o se deben a la inclinación del gantry."
"The slices are tilted away from the standard planes; the nearest one is coronal, at the angle shown. Tilted slices are used to follow a structure such as a joint or a vessel." = "Los cortes están inclinados respecto a los planos estándar; el más próximo es el coronal, con el ángulo indicado. Los cortes inclinados se usan para seguir una estructura, como una articulación o un vaso."
"The slices are tilted away from the standard planes; the nearest one is sagittal, at the angle shown. Tilted slices are used to follow a structure such as a joint or a vessel." = "Los cortes están inclinados respecto a los planos estándar; el más próximo es el sagital, con el ángulo indicado. Los cortes inclinados se usan para seguir una estructura, como una articulación o un vaso."
"A localizer (scout or topogram) is a quick projection image taken before the CT scan. It is used to plan where the slices will be taken." = "Un localizador (scout o topograma) es una imagen de proyección rápida obtenida antes de la TC. Sirve para planificar dónde se adquirirán los cortes."
"The localizer was taken from the front, like a frontal radiograph." = "El localizador se obtuvo de frente, como una radiografía frontal."
"The localizer was taken from the side, like a lateral radiograph." = "El localizador se obtuvo de lado, como una radiografía lateral."
"The localizer orientation is neither front-on nor side-on within 10 degrees. The tool does not guess when the header does not say." = "La orientación del localizador no es frontal ni lateral con un margen de 10 grados. La herramienta no adivina cuando la cabecera no lo indica."
"A CT acquired without intravenous contrast. It shows tissue density without the effect of contrast and is often the reference for later contrast phases." = "TC adquirida sin contraste intravenoso. Muestra la densidad de los tejidos sin el efecto del contraste y suele servir de referencia para las fases con contraste posteriores."
"A CT timed for contrast in the arteries (CT angiography). It is used to show blood vessels." = "TC sincronizada con el paso del contraste por las arterias (angio-TC). Se usa para mostrar los vasos sanguíneos."
"A CT taken shortly after contrast injection, while contrast is mainly in the arteries. It shows structures that take up contrast early." = "TC obtenida poco después de inyectar el contraste, cuando este se encuentra sobre todo en las arterias. Muestra las estructuras que captan contraste de forma precoz."
"A CT taken about a minute after contrast injection, when contrast fills the portal vein and liver. It is the standard phase for abdominal CT." = "TC obtenida aproximadamente un minuto después de inyectar el contraste, cuando este rellena la vena porta y el hígado. Es la fase estándar de la TC abdominal."
"A CT taken after contrast has reached the veins. It is used to show veins and organs in their enhanced state." = "TC obtenida cuando el contraste ha llegado a las venas. Se usa para mostrar las venas y los órganos realzados."
"A CT taken when contrast fills the kidney tissue evenly, about 100 seconds after injection. It is used to examine the kidneys." = "TC obtenida cuando el contraste rellena de forma homogénea el parénquima renal, unos 100 segundos tras la inyección. Se usa para estudiar los riñones."
"A CT taken several minutes after contrast, when the kidneys excrete it into the urinary tract. It is used to outline the urinary tract." = "TC obtenida varios minutos después del contraste, cuando los riñones lo excretan a la vía urinaria. Se usa para delimitar la vía urinaria."
"A CT taken several minutes after contrast injection. It shows how contrast washes in or out of tissues over time." = "TC obtenida varios minutos después de inyectar el contraste. Muestra cómo el contraste entra en los tejidos o se lava de ellos con el tiempo."
"A contrast agent is recorded in the header, but the description does not name the phase." = "La cabecera registra un medio de contraste, pero la descripción no indica la fase."
"A MIP shows, along each line of sight, the brightest voxel of a slab of slices. It is often used to show vessels or small nodules." = "Una MIP muestra, a lo largo de cada línea de visión, el vóxel más brillante de un bloque de cortes. Se usa a menudo para mostrar vasos o nódulos pequeños."
"A MinIP shows, along each line of sight, the darkest voxel of a slab of slices. It is often used to show the airways and lung." = "Una MinIP muestra, a lo largo de cada línea de visión, el vóxel más oscuro de un bloque de cortes. Se usa a menudo para mostrar la vía aérea y el pulmón."
"A volume rendering is a 3D picture computed from the slices. It is used for overview and planning." = "Una representación volumétrica es una imagen 3D calculada a partir de los cortes. Se usa para tener una visión de conjunto y para planificar."
"A reformat recomputes the slices in another plane from the original volume. It lets the same scan be read in axial, coronal or sagittal views." = "Una reconstrucción multiplanar recalcula los cortes en otro plano a partir del volumen original. Permite leer el mismo estudio en planos axial, coronal o sagital."
"The image comes from a scan at two X-ray energies (dual-energy or spectral CT). Such scans can be turned into images of different energies or materials." = "La imagen procede de una adquisición con dos energías de rayos X (TC de energía dual o espectral). Estos estudios pueden convertirse en imágenes de distintas energías o materiales."
"A virtual monoenergetic image simulates a scan at a single X-ray energy, shown in keV. Low energies increase contrast; high energies reduce metal and beam-hardening artefacts." = "Una imagen monoenergética virtual simula una adquisición con una única energía de rayos X, indicada en keV. Las energías bajas aumentan el contraste; las altas reducen los artefactos metálicos y de endurecimiento del haz."
"The reconstruction kernel is sharp, made for bone detail. Edges are crisp and noise is higher." = "El kernel de reconstrucción es duro, pensado para el detalle óseo. Los bordes son nítidos y el ruido es mayor."
"The reconstruction kernel is sharp, made for lung detail. Edges are crisp and noise is higher." = "El kernel de reconstrucción es duro, pensado para el detalle pulmonar. Los bordes son nítidos y el ruido es mayor."
"The reconstruction kernel is smooth, made for soft tissue. Noise is low and fine edges are softer." = "El kernel de reconstrucción es blando, pensado para partes blandas. El ruido es bajo y los bordes finos se ven más suaves."
"The reconstruction kernel is a smooth head kernel, made for brain tissue contrast." = "El kernel de reconstrucción es un kernel blando de cráneo, pensado para el contraste del tejido cerebral."
"The reconstruction kernel is a sharp body kernel. The name alone does not say whether it was meant for bone or for lung." = "El kernel de reconstrucción es un kernel corporal duro. Su nombre no basta para saber si estaba pensado para hueso o para pulmón."
"The reconstruction kernel shown is not in the tool's tables, so its family is not named." = "El kernel de reconstrucción indicado no figura en las tablas de la herramienta, por lo que no se nombra su familia."
"The header records a contrast agent for this series, by the name shown." = "La cabecera registra un medio de contraste para esta serie, con el nombre indicado."
"The header records no contrast agent, but the series description uses a word for contrast. Descriptions are typed by people and can be wrong." = "La cabecera no registra ningún medio de contraste, pero la descripción de la serie usa una palabra que alude al contraste. Las descripciones las escriben personas y pueden ser erróneas."
"T1-weighted images show fat bright and fluid dark. They are used to show anatomy." = "Las imágenes potenciadas en T1 muestran la grasa brillante y el líquido oscuro. Se usan para mostrar la anatomía."
"T1-weighted images taken after a gadolinium contrast injection. Tissues that take up contrast appear brighter than before." = "Imágenes potenciadas en T1 obtenidas tras inyectar contraste de gadolinio. Los tejidos que captan contraste aparecen más brillantes que antes."
"T1-weighted images from a fast gradient-echo sequence, often acquired in 3D or in one breath-hold." = "Imágenes potenciadas en T1 de una secuencia rápida de eco de gradiente, a menudo adquiridas en 3D o en una sola apnea."
"T1-weighted gradient-echo images taken after a gadolinium contrast injection, often in 3D or in one breath-hold." = "Imágenes potenciadas en T1 de eco de gradiente obtenidas tras inyectar contraste de gadolinio, a menudo en 3D o en una sola apnea."
"T1-weighted images with an inversion pulse that increases T1 contrast (for example MPRAGE). They are often 3D and used for detailed anatomy." = "Imágenes potenciadas en T1 con un pulso de inversión que aumenta el contraste T1 (por ejemplo, MPRAGE). Suelen ser 3D y se usan para la anatomía detallada."
"T1-weighted inversion-prepared images (for example MPRAGE) taken after a gadolinium contrast injection." = "Imágenes potenciadas en T1 con preparación de inversión (por ejemplo, MPRAGE) obtenidas tras inyectar contraste de gadolinio."
"T2-weighted images show fluid bright. They are a basic sequence in most MR examinations." = "Las imágenes potenciadas en T2 muestran el líquido brillante. Son una secuencia básica en la mayoría de los estudios de RM."
"Proton density-weighted images show the amount of water and fat in tissue, with little T1 or T2 contrast. They are common in joint imaging." = "Las imágenes potenciadas en densidad protónica muestran la cantidad de agua y grasa del tejido, con poco contraste T1 o T2. Son habituales en el estudio de las articulaciones."
"FLAIR is a T2-weighted image in which the signal of free fluid such as cerebrospinal fluid is nulled. It is widely used in brain imaging." = "FLAIR es una imagen potenciada en T2 en la que se anula la señal del líquido libre, como el líquido cefalorraquídeo. Se usa mucho en neuroimagen."
"STIR is an inversion recovery sequence that nulls the signal of fat. Fluid stays bright, so it is used where fat would hide it." = "STIR es una secuencia de inversión-recuperación que anula la señal de la grasa. El líquido sigue brillante, por lo que se usa donde la grasa lo ocultaría."
"T2*-weighted gradient-echo images are sensitive to magnetic disturbances such as iron, blood products and calcium." = "Las imágenes de eco de gradiente potenciadas en T2* son sensibles a las alteraciones magnéticas, como el hierro, los productos de degradación de la sangre y el calcio."
"Susceptibility-weighted imaging is a gradient-echo technique that strongly shows magnetic differences, such as those of veins, blood products and calcium." = "La imagen potenciada en susceptibilidad es una técnica de eco de gradiente que pone muy de manifiesto las diferencias magnéticas, como las de las venas, los productos de degradación de la sangre y el calcio."
"Balanced steady-state free precession is a fast sequence where fluid is bright. It is used for the heart, fetal imaging and fluid-filled structures." = "La precesión libre en estado estacionario balanceada es una secuencia rápida en la que el líquido es brillante. Se usa para el corazón, la imagen fetal y las estructuras llenas de líquido."
"Diffusion-weighted images show how freely water molecules move in tissue." = "Las imágenes potenciadas en difusión muestran con qué libertad se mueven las moléculas de agua en el tejido."
"Trace diffusion-weighted images combine three diffusion directions into one image of how freely water moves." = "Las imágenes de difusión de traza combinan tres direcciones de difusión en una sola imagen de la libertad de movimiento del agua."
"Diffusion images acquired in many directions (diffusion tensor imaging). They are used to compute maps such as fractional anisotropy and to trace white matter tracts." = "Imágenes de difusión adquiridas en muchas direcciones (imagen por tensor de difusión). Se usan para calcular mapas como el de anisotropía fraccional y para trazar los tractos de sustancia blanca."
"The b = 0 image of a diffusion series has no diffusion weighting and looks like a T2-weighted image. It is the reference for the diffusion maps." = "La imagen b = 0 de una serie de difusión no tiene potenciación en difusión y se parece a una imagen potenciada en T2. Es la referencia para los mapas de difusión."
"The apparent diffusion coefficient (ADC) map is computed from diffusion images and shows water mobility as a number per pixel." = "El mapa del coeficiente de difusión aparente (ADC) se calcula a partir de las imágenes de difusión y muestra la movilidad del agua como un número por píxel."
"The exponential ADC map is computed from diffusion images. It removes the T2 contribution from the diffusion-weighted image." = "El mapa de ADC exponencial se calcula a partir de las imágenes de difusión. Elimina la contribución T2 de la imagen potenciada en difusión."
"The fractional anisotropy map is computed from diffusion tensor data and shows how directional water movement is. It is used to study white matter." = "El mapa de anisotropía fraccional se calcula a partir de los datos del tensor de difusión y muestra cuán direccional es el movimiento del agua. Se usa para estudiar la sustancia blanca."
"Perfusion imaging measures blood flow through tissue, with injected contrast (DSC, DCE) or with magnetically labelled blood (ASL)." = "La imagen de perfusión mide el flujo sanguíneo a través del tejido, con contraste inyectado (DSC, DCE) o con sangre marcada magnéticamente (ASL)."
"Time-of-flight MR angiography shows flowing blood bright without contrast injection. It is commonly used for the brain arteries." = "La angio-RM por tiempo de vuelo muestra brillante la sangre en movimiento sin inyectar contraste. Se usa habitualmente para las arterias cerebrales."
"Phase-contrast MR shows flowing blood and can measure its speed and direction without contrast." = "La RM con contraste de fase muestra la sangre en movimiento y puede medir su velocidad y dirección sin contraste."
"Contrast-enhanced MR angiography shows vessels filled with injected gadolinium contrast." = "La angio-RM con contraste muestra los vasos rellenos de contraste de gadolinio inyectado."
"MR angiography shows blood vessels. The technique is not stated in the header." = "La angio-RM muestra los vasos sanguíneos. La cabecera no indica la técnica."
"The images were acquired slice by slice (2D acquisition)." = "Las imágenes se adquirieron corte a corte (adquisición 2D)."
"The images were acquired as one volume (3D acquisition), which allows thin slices and reformats in any plane." = "Las imágenes se adquirieron como un único volumen (adquisición 3D), lo que permite cortes finos y reconstrucciones en cualquier plano."
"The series description, or the water image of a Dixon series, indicates fat suppression, which makes fat dark so that other tissues stand out." = "La descripción de la serie, o la imagen de agua de una serie Dixon, indica supresión grasa, que oscurece la grasa para que destaquen otros tejidos."
"A gradient-echo image whose header shows neither spoiling (SP in Sequence Variant, or a low flip angle with a short TR) nor a T1 description, so its weighting is not named. Unspoiled gradient echo, such as balanced SSFP, is not T1-weighted. The tool does not guess when the header does not say." = "Imagen de eco de gradiente cuya cabecera no indica destrucción de la magnetización transversal (spoiling: SP en Sequence Variant, o un ángulo de inclinación bajo con TR corto) ni una descripción T1, por lo que no se nombra su potenciación. El eco de gradiente sin destrucción de la magnetización transversal, como el SSFP balanceado, no está potenciado en T1. La herramienta no adivina cuando la cabecera no lo indica."
"The PET image is corrected for attenuation, the absorption of radiation by the body. Corrected images are the ones used for quantitative values such as SUV." = "La imagen PET está corregida por atenuación, la absorción de la radiación por el cuerpo. Las imágenes corregidas son las que se usan para valores cuantitativos como el SUV."
"The PET image is not corrected for attenuation. It is often kept to check for artefacts of the correction." = "La imagen PET no está corregida por atenuación. Suele conservarse para comprobar artefactos de la corrección."
"Neither the description, the Image Type nor the Units say whether attenuation correction was applied. The tool does not guess when the header does not say." = "Ni la descripción, ni Image Type, ni Units indican si se aplicó corrección de atenuación. La herramienta no adivina cuando la cabecera no lo indica."
"Pixel values are activity concentration in becquerels per millilitre, from which SUV can be computed." = "Los valores de píxel son concentración de actividad en becquerelios por mililitro, a partir de la cual puede calcularse el SUV."
"Pixel values are in grams per millilitre, the unit used for standardized uptake values (SUV)." = "Los valores de píxel están en gramos por mililitro, la unidad de los valores de captación estandarizados (SUV)."
"Pixel values are detected counts, not calibrated to activity." = "Los valores de píxel son cuentas detectadas, no calibradas en actividad."
"Pixel values are in the unit shown, as recorded in the Units field." = "Los valores de píxel están en la unidad indicada, tal como figura en el campo Units."
"A static acquisition records one image of the tracer distribution over the acquisition time." = "Una adquisición estática registra una imagen de la distribución del trazador durante el tiempo de adquisición."
"A dynamic acquisition records a sequence of time frames to follow how the tracer moves over time." = "Una adquisición dinámica registra una secuencia de fotogramas temporales para seguir cómo se mueve el trazador con el tiempo."
"A gated acquisition sorts data by heartbeat or breathing phase to reduce motion." = "Una adquisición sincronizada (gated) ordena los datos por fase del latido o de la respiración para reducir el movimiento."
"A whole-body acquisition covers a long part of the body in several bed positions joined together." = "Una adquisición de cuerpo entero cubre una gran parte del cuerpo en varias posiciones de camilla unidas."
"A maximum intensity projection shows the brightest value along each line of sight. In PET it gives a quick overview of the whole tracer distribution." = "Una proyección de máxima intensidad muestra el valor más brillante a lo largo de cada línea de visión. En PET da una visión rápida de toda la distribución del trazador."
"A static nuclear medicine image is a single planar picture of the tracer distribution." = "Una imagen estática de medicina nuclear es una única imagen planar de la distribución del trazador."
"A whole-body nuclear medicine image is a planar scan of the whole body, typically front and back. It is common for bone scans." = "Una imagen de cuerpo entero de medicina nuclear es un barrido planar de todo el cuerpo, normalmente anterior y posterior. Es habitual en la gammagrafía ósea."
"A dynamic nuclear medicine study is a sequence of planar images over time to follow tracer flow or uptake." = "Un estudio dinámico de medicina nuclear es una secuencia de imágenes planares a lo largo del tiempo para seguir el flujo o la captación del trazador."
"A gated nuclear medicine study sorts images by heartbeat phase, as used for heart function." = "Un estudio sincronizado (gated) de medicina nuclear ordena las imágenes por fase del latido, como se hace para la función cardiaca."
"These are the raw projections of a SPECT acquisition, taken while the camera rotates. They are reconstructed into slices." = "Son las proyecciones brutas de una adquisición SPECT, obtenidas mientras gira la gammacámara. Se reconstruyen en cortes."
"These are the raw projections of a gated SPECT acquisition, sorted by heartbeat phase." = "Son las proyecciones brutas de una adquisición SPECT sincronizada (gated), ordenadas por fase del latido."
"These are slices reconstructed from a SPECT acquisition, showing the tracer distribution in 3D." = "Son cortes reconstruidos a partir de una adquisición SPECT, que muestran la distribución del trazador en 3D."
"These are slices reconstructed from a gated SPECT acquisition, typically of the heart, one volume per heartbeat phase." = "Son cortes reconstruidos a partir de una adquisición SPECT sincronizada (gated), normalmente del corazón, un volumen por fase del latido."
"The nuclear medicine acquisition type shown is not in the tool's tables." = "El tipo de adquisición de medicina nuclear indicado no figura en las tablas de la herramienta."
"A planar nuclear medicine view taken from the front of the patient." = "Proyección planar de medicina nuclear obtenida desde la parte anterior del paciente."
"A planar nuclear medicine view taken from the back of the patient." = "Proyección planar de medicina nuclear obtenida desde la parte posterior del paciente."
"A planar nuclear medicine view taken from the side of the patient." = "Proyección planar de medicina nuclear obtenida desde un lado del paciente."
"Neither Patient Orientation nor the series description names the view. The tool does not guess when the header does not say." = "Ni Patient Orientation ni la descripción de la serie indican la proyección. La herramienta no adivina cuando la cabecera no lo indica."
"The series description names both the anterior and the posterior view, as for a whole-body scan stored with both views, so the view of this image is not named. The tool does not guess when the header does not say." = "La descripción de la serie nombra a la vez la proyección anterior y la posterior, como en un barrido de cuerpo entero guardado con ambas proyecciones, por lo que no se nombra la proyección de esta imagen. La herramienta no adivina cuando la cabecera no lo indica."
"A projection radiograph: an X-ray image of a body part, flattened onto one plane." = "Radiografía de proyección: una imagen de rayos X de una región del cuerpo, proyectada sobre un solo plano."
"An image from fluoroscopy, live X-ray imaging used to follow movement or guide procedures." = "Imagen de fluoroscopia, la imagen de rayos X en tiempo real que se usa para seguir el movimiento o guiar procedimientos."
"A panoramic dental radiograph shows the whole of both jaws and the teeth in one image." = "Una radiografía dental panorámica muestra ambos maxilares completos y los dientes en una sola imagen."
"An intra-oral dental radiograph is taken with the detector inside the mouth, showing a few teeth in detail." = "Una radiografía dental intraoral se obtiene con el detector dentro de la boca y muestra algunos dientes con detalle."
"Anteroposterior view: the X-rays pass from the front of the body to the back." = "Proyección anteroposterior: los rayos X atraviesan el cuerpo de delante atrás."
"Posteroanterior view: the X-rays pass from the back of the body to the front. It is the standard view for an upright chest radiograph." = "Proyección posteroanterior: los rayos X atraviesan el cuerpo de atrás adelante. Es la proyección estándar de la radiografía de tórax en bipedestación."
"Lateral view with the patient's left side against the detector." = "Proyección lateral con el lado izquierdo del paciente apoyado en el detector."
"Lateral view with the patient's right side against the detector." = "Proyección lateral con el lado derecho del paciente apoyado en el detector."
"View taken with the patient lying on the right side and a horizontal X-ray beam." = "Proyección obtenida con el paciente acostado sobre el lado derecho y el haz de rayos X horizontal."
"View taken with the patient lying on the left side and a horizontal X-ray beam." = "Proyección obtenida con el paciente acostado sobre el lado izquierdo y el haz de rayos X horizontal."
"Oblique view with the patient turned so the right side is nearer the detector." = "Proyección oblicua con el paciente girado de modo que el lado derecho queda más cerca del detector."
"Oblique view with the patient turned so the left side is nearer the detector." = "Proyección oblicua con el paciente girado de modo que el lado izquierdo queda más cerca del detector."
"Lateral view: a side view of the body part. The side nearer the detector is not stated." = "Proyección lateral: una vista de perfil de la región. No se indica qué lado está más cerca del detector."
"Oblique view: the body part is turned at an angle between frontal and lateral." = "Proyección oblicua: la región está girada con un ángulo intermedio entre la frontal y la lateral."
"The View Position code shown is not in the tool's tables." = "El código de View Position indicado no figura en las tablas de la herramienta."
"No view is recorded, but the image directions in Patient Orientation run left-right and head-feet, as in a frontal (AP or PA) view. Whether it is AP or PA is not known." = "No consta la proyección, pero las direcciones de la imagen en Patient Orientation van de izquierda a derecha y de cabeza a pies, como en una proyección frontal (AP o PA). No se sabe si es AP o PA."
"No view is recorded, but the image directions in Patient Orientation run front-back and head-feet, as in a lateral view." = "No consta la proyección, pero las direcciones de la imagen en Patient Orientation van de delante atrás y de cabeza a pies, como en una proyección lateral."
"No view is recorded, but the image directions in Patient Orientation run left-right and front-back, as in an axial view." = "No consta la proyección, pero las direcciones de la imagen en Patient Orientation van de izquierda a derecha y de delante atrás, como en una proyección axial."
"The header records the left side." = "La cabecera registra el lado izquierdo."
"The header records the right side." = "La cabecera registra el lado derecho."
"The header records both sides." = "La cabecera registra ambos lados."
"A mammogram is a low-dose X-ray image of the breast." = "Una mamografía es una imagen de rayos X de baja dosis de la mama."
"Breast tomosynthesis takes several low-dose images over an arc and builds thin slices of the breast. It reduces the overlap of tissue." = "La tomosíntesis de mama obtiene varias imágenes de baja dosis a lo largo de un arco y construye cortes finos de la mama. Reduce la superposición de tejido."
"A synthetic 2D mammogram is computed from tomosynthesis data instead of being taken as a separate exposure." = "Una mamografía 2D sintetizada se calcula a partir de los datos de tomosíntesis en lugar de obtenerse con una exposición aparte."
"The image is of the left breast." = "La imagen es de la mama izquierda."
"The image is of the right breast." = "La imagen es de la mama derecha."
"The image includes both breasts." = "La imagen incluye ambas mamas."
"An X-ray angiography run is a series of X-ray images taken while contrast flows through vessels. The C-arm angles give the viewing direction." = "Una serie de angiografía con rayos X es una sucesión de imágenes de rayos X obtenidas mientras el contraste fluye por los vasos. Los ángulos del arco en C dan la dirección de la vista."
"An ultrasound image with colour, usually colour Doppler showing blood flow or a colour map. Colour alone does not tell which mode was used." = "Una imagen ecográfica en color, normalmente Doppler color que muestra el flujo sanguíneo o un mapa de color. El color por sí solo no indica qué modo se usó."
"A greyscale ultrasound image, showing tissue echoes." = "Una imagen ecográfica en escala de grises, que muestra los ecos de los tejidos."
"Ultrasound probe position and view are not stored in standard header fields, so the tool cannot name them." = "La posición del transductor y la proyección ecográfica no se guardan en campos estándar de la cabecera, por lo que la herramienta no puede nombrarlas."
"The host did not report the modality, so it was inferred from which tags are present. Treat it with caution." = "El visor no indicó la modalidad, así que se dedujo de las etiquetas presentes. Tómela con cautela."
"The tool has no identification rules for this modality." = "La herramienta no tiene reglas de identificación para esta modalidad."
"The modality is not reported and could not be inferred from the tags. The tool does not guess when the header does not say." = "No consta la modalidad y no pudo deducirse de las etiquetas. La herramienta no adivina cuando la cabecera no lo indica."
"The image has no orientation in the header, so the plane cannot be computed. The tool does not guess when the header does not say." = "La imagen no tiene orientación en la cabecera, por lo que no puede calcularse el plano. La herramienta no adivina cuando la cabecera no lo indica."
"No contrast agent is recorded and the description names no phase. This does not mean no contrast was given. The tool does not guess when the header does not say." = "No consta ningún medio de contraste y la descripción no indica ninguna fase. Esto no significa que no se administrara contraste. La herramienta no adivina cuando la cabecera no lo indica."
"The reconstruction kernel is not recorded. The tool does not guess when the header does not say." = "No consta el kernel de reconstrucción. La herramienta no adivina cuando la cabecera no lo indica."
"Repetition time and echo time are not recorded and the description names no weighting. The tool does not guess when the header does not say." = "No constan el tiempo de repetición ni el tiempo de eco, y la descripción no indica ninguna potenciación. La herramienta no adivina cuando la cabecera no lo indica."
"The repetition and echo times fall between the usual T1, proton density and T2 ranges, and the description names no weighting. The tool does not guess when the header does not say." = "Los tiempos de repetición y de eco quedan entre los rangos habituales de T1, densidad protónica y T2, y la descripción no indica ninguna potenciación. La herramienta no adivina cuando la cabecera no lo indica."
"The pixel Units are not recorded and the description does not say whether attenuation correction was applied. The tool does not guess when the header does not say." = "No constan las unidades de píxel (Units) y la descripción no indica si se aplicó corrección de atenuación. La herramienta no adivina cuando la cabecera no lo indica."
"The Image Type that names the nuclear medicine acquisition type is not recorded. The tool does not guess when the header does not say." = "No consta el Image Type que indica el tipo de adquisición de medicina nuclear. La herramienta no adivina cuando la cabecera no lo indica."
"Neither View Position nor Patient Orientation is recorded, so the projection is unknown. The tool does not guess when the header does not say." = "No constan View Position ni Patient Orientation, por lo que se desconoce la proyección. La herramienta no adivina cuando la cabecera no lo indica."
"View Position is not recorded, so the mammographic view is unknown. The tool does not guess when the header does not say." = "No consta View Position, por lo que se desconoce la proyección mamográfica. La herramienta no adivina cuando la cabecera no lo indica."
"Image Laterality is not recorded, so the side is unknown. The tool does not guess when the header does not say." = "No consta Image Laterality, por lo que se desconoce el lado. La herramienta no adivina cuando la cabecera no lo indica."
"The C-arm primary angle is not recorded, so the viewing direction is unknown. The tool does not guess when the header does not say." = "No consta el ángulo primario del arco en C, por lo que se desconoce la dirección de la vista. La herramienta no adivina cuando la cabecera no lo indica."
"The C-arm secondary angle is not recorded, so the cranial or caudal tilt is unknown. The tool does not guess when the header does not say." = "No consta el ángulo secundario del arco en C, por lo que se desconoce la angulación craneal o caudal. La herramienta no adivina cuando la cabecera no lo indica."
"Body Part Examined is not recorded. The tool does not guess when the header does not say." = "No consta Body Part Examined. La herramienta no adivina cuando la cabecera no lo indica."
"The image detector is rotated toward the patient's left (left anterior oblique) and tilted toward the head (cranial), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está girado hacia la izquierda del paciente (oblicua anterior izquierda, OAI) e inclinado hacia la cabeza (craneal), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is rotated toward the patient's left (left anterior oblique) and tilted toward the feet (caudal), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está girado hacia la izquierda del paciente (oblicua anterior izquierda, OAI) e inclinado hacia los pies (caudal), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is rotated toward the patient's left (left anterior oblique), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está girado hacia la izquierda del paciente (oblicua anterior izquierda, OAI), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is rotated toward the patient's right (right anterior oblique) and tilted toward the head (cranial), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está girado hacia la derecha del paciente (oblicua anterior derecha, OAD) e inclinado hacia la cabeza (craneal), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is rotated toward the patient's right (right anterior oblique) and tilted toward the feet (caudal), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está girado hacia la derecha del paciente (oblicua anterior derecha, OAD) e inclinado hacia los pies (caudal), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is rotated toward the patient's right (right anterior oblique), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está girado hacia la derecha del paciente (oblicua anterior derecha, OAD), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is straight above the patient (frontal) and tilted toward the head (cranial), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está justo encima del paciente (frontal) e inclinado hacia la cabeza (craneal), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is straight above the patient (frontal) and tilted toward the feet (caudal), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está justo encima del paciente (frontal) e inclinado hacia los pies (caudal), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"The image detector is straight above the patient (frontal), by the angles shown. Angiography uses these angles to see vessels without overlap." = "El detector de imagen está justo encima del paciente (frontal), con los ángulos indicados. La angiografía usa estos ángulos para ver los vasos sin superposición."
"Cranio-caudal view: the breast is compressed from above and imaged from top to bottom. Screening uses mainly CC and MLO." = "Proyección craneocaudal: la mama se comprime desde arriba y se obtiene la imagen de arriba abajo. El cribado usa principalmente CC y OML."
"Medio-lateral oblique view: the breast is imaged at an angle from the middle outward. It shows the most breast tissue, up into the armpit. Screening uses mainly CC and MLO." = "Proyección oblicua mediolateral: la imagen de la mama se obtiene en ángulo, de dentro afuera. Es la que muestra más tejido mamario, hasta la axila. El cribado usa principalmente CC y OML."
"Medio-lateral view: a straight side view of the breast, taken from the middle outward. Screening uses mainly CC and MLO." = "Proyección mediolateral: una vista lateral pura de la mama, obtenida de dentro afuera. El cribado usa principalmente CC y OML."
"Latero-medial view: a straight side view of the breast, taken from the outside inward. Screening uses mainly CC and MLO." = "Proyección lateromedial: una vista lateral pura de la mama, obtenida de fuera adentro. El cribado usa principalmente CC y OML."
"Latero-medial oblique view: an angled view taken from the outside inward. Screening uses mainly CC and MLO." = "Proyección oblicua lateromedial: una vista en ángulo obtenida de fuera adentro. El cribado usa principalmente CC y OML."
"Caudo-cranial view (from below): the breast is imaged from bottom to top. Screening uses mainly CC and MLO." = "Proyección caudocraneal (desde abajo): la imagen de la mama se obtiene de abajo arriba. El cribado usa principalmente CC y OML."
"Superolateral to inferomedial oblique view: an angled view from the upper outer side. Screening uses mainly CC and MLO." = "Proyección oblicua superolateral-inferomedial: una vista en ángulo desde el lado superior externo. El cribado usa principalmente CC y OML."
"Inferomedial to superolateral oblique view: an angled view from the lower inner side. Screening uses mainly CC and MLO." = "Proyección oblicua inferomedial-superolateral: una vista en ángulo desde el lado inferior interno. El cribado usa principalmente CC y OML."
"Exaggerated cranio-caudal view, turned to include the outer part of the breast. Screening uses mainly CC and MLO." = "Proyección craneocaudal exagerada, girada para incluir la parte externa de la mama. El cribado usa principalmente CC y OML."
"Exaggerated cranio-caudal view, turned to include the inner part of the breast. Screening uses mainly CC and MLO." = "Proyección craneocaudal exagerada, girada para incluir la parte interna de la mama. El cribado usa principalmente CC y OML."
"Axillary tail view: an angled view of the outer upper part of the breast, toward the armpit. Screening uses mainly CC and MLO." = "Proyección de la prolongación axilar: una vista en ángulo de la parte superior externa de la mama, hacia la axila. El cribado usa principalmente CC y OML."
"Cleavage view: both breasts are imaged together to show the tissue near the breastbone. Screening uses mainly CC and MLO." = "Proyección del surco intermamario: ambas mamas se obtienen juntas para mostrar el tejido próximo al esternón. El cribado usa principalmente CC y OML."
"The body part as recorded in the header (Body Part Examined), chosen or typed at the scanner. It can be missing or too general." = "La región tal como consta en la cabecera (Body Part Examined), elegida o escrita en el equipo. Puede faltar o ser demasiado general."
