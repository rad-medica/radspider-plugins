"Axial slices are horizontal cuts through the body, viewed as if from the feet. Most CT and MR series are acquired or shown in this plane." = ""
"Coronal slices are vertical cuts from front to back, so the image faces you like a person standing in front of you." = ""
"Sagittal slices are vertical cuts from left to right, showing the body in side view. They are often used for the spine and the midline of the brain." = ""
"The slices are tilted away from the standard planes; the nearest one is axial, at the angle shown. Tilted slices are used to follow a structure or come from gantry tilt." = ""
"The slices are tilted away from the standard planes; the nearest one is coronal, at the angle shown. Tilted slices are used to follow a structure such as a joint or a vessel." = ""
"The slices are tilted away from the standard planes; the nearest one is sagittal, at the angle shown. Tilted slices are used to follow a structure such as a joint or a vessel." = ""
"A localizer (scout or topogram) is a quick projection image taken before the CT scan. It is used to plan where the slices will be taken." = ""
"The localizer was taken from the front, like a frontal radiograph." = ""
"The localizer was taken from the side, like a lateral radiograph." = ""
"The localizer orientation is neither front-on nor side-on within 10 degrees. The tool does not guess when the header does not say." = ""
"A CT acquired without intravenous contrast. It shows tissue density without the effect of contrast and is often the reference for later contrast phases." = ""
"A CT timed for contrast in the arteries (CT angiography). It is used to show blood vessels." = ""
"A CT taken shortly after contrast injection, while contrast is mainly in the arteries. It shows structures that take up contrast early." = ""
"A CT taken about a minute after contrast injection, when contrast fills the portal vein and liver. It is the standard phase for abdominal CT." = ""
"A CT taken after contrast has reached the veins. It is used to show veins and organs in their enhanced state." = ""
"A CT taken when contrast fills the kidney tissue evenly, about 100 seconds after injection. It is used to examine the kidneys." = ""
"A CT taken several minutes after contrast, when the kidneys excrete it into the urinary tract. It is used to outline the urinary tract." = ""
"A CT taken several minutes after contrast injection. It shows how contrast washes in or out of tissues over time." = ""
"A contrast agent is recorded in the header, but the description does not name the phase." = ""
"A MIP shows, along each line of sight, the brightest voxel of a slab of slices. It is often used to show vessels or small nodules." = ""
"A MinIP shows, along each line of sight, the darkest voxel of a slab of slices. It is often used to show the airways and lung." = ""
"A volume rendering is a 3D picture computed from the slices. It is used for overview and planning." = ""
"A reformat recomputes the slices in another plane from the original volume. It lets the same scan be read in axial, coronal or sagittal views." = ""
"The image comes from a scan at two X-ray energies (dual-energy or spectral CT). Such scans can be turned into images of different energies or materials." = ""
"A virtual monoenergetic image simulates a scan at a single X-ray energy, shown in keV. Low energies increase contrast; high energies reduce metal and beam-hardening artefacts." = ""
"The reconstruction kernel is sharp, made for bone detail. Edges are crisp and noise is higher." = ""
"The reconstruction kernel is sharp, made for lung detail. Edges are crisp and noise is higher." = ""
"The reconstruction kernel is smooth, made for soft tissue. Noise is low and fine edges are softer." = ""
"The reconstruction kernel is a smooth head kernel, made for brain tissue contrast." = ""
"The reconstruction kernel is a sharp body kernel. The name alone does not say whether it was meant for bone or for lung." = ""
"The reconstruction kernel shown is not in the tool's tables, so its family is not named." = ""
"The header records a contrast agent for this series, by the name shown." = ""
"The header records no contrast agent, but the series description uses a word for contrast. Descriptions are typed by people and can be wrong." = ""
"T1-weighted images show fat bright and fluid dark. They are used to show anatomy." = ""
"T1-weighted images taken after a gadolinium contrast injection. Tissues that take up contrast appear brighter than before." = ""
"T1-weighted images from a fast gradient-echo sequence, often acquired in 3D or in one breath-hold." = ""
"T1-weighted gradient-echo images taken after a gadolinium contrast injection, often in 3D or in one breath-hold." = ""
"T1-weighted images with an inversion pulse that increases T1 contrast (for example MPRAGE). They are often 3D and used for detailed anatomy." = ""
"T1-weighted inversion-prepared images (for example MPRAGE) taken after a gadolinium contrast injection." = ""
"T2-weighted images show fluid bright. They are a basic sequence in most MR examinations." = ""
"Proton density-weighted images show the amount of water and fat in tissue, with little T1 or T2 contrast. They are common in joint imaging." = ""
"FLAIR is a T2-weighted image in which the signal of free fluid such as cerebrospinal fluid is nulled. It is widely used in brain imaging." = ""
"STIR is an inversion recovery sequence that nulls the signal of fat. Fluid stays bright, so it is used where fat would hide it." = ""
"T2*-weighted gradient-echo images are sensitive to magnetic disturbances such as iron, blood products and calcium." = ""
"Susceptibility-weighted imaging is a gradient-echo technique that strongly shows magnetic differences, such as those of veins, blood products and calcium." = ""
"Balanced steady-state free precession is a fast sequence where fluid is bright. It is used for the heart, fetal imaging and fluid-filled structures." = ""
"Diffusion-weighted images show how freely water molecules move in tissue." = ""
"Trace diffusion-weighted images combine three diffusion directions into one image of how freely water moves." = ""
"Diffusion images acquired in many directions (diffusion tensor imaging). They are used to compute maps such as fractional anisotropy and to trace white matter tracts." = ""
"The b = 0 image of a diffusion series has no diffusion weighting and looks like a T2-weighted image. It is the reference for the diffusion maps." = ""
"The apparent diffusion coefficient (ADC) map is computed from diffusion images and shows water mobility as a number per pixel." = ""
"The exponential ADC map is computed from diffusion images. It removes the T2 contribution from the diffusion-weighted image." = ""
"The fractional anisotropy map is computed from diffusion tensor data and shows how directional water movement is. It is used to study white matter." = ""
"Perfusion imaging measures blood flow through tissue, with injected contrast (DSC, DCE) or with magnetically labelled blood (ASL)." = ""
"Time-of-flight MR angiography shows flowing blood bright without contrast injection. It is commonly used for the brain arteries." = ""
"Phase-contrast MR shows flowing blood and can measure its speed and direction without contrast." = ""
"Contrast-enhanced MR angiography shows vessels filled with injected gadolinium contrast." = ""
"MR angiography shows blood vessels. The technique is not stated in the header." = ""
"The images were acquired slice by slice (2D acquisition)." = ""
"The images were acquired as one volume (3D acquisition), which allows thin slices and reformats in any plane." = ""
"The series description, or the water image of a Dixon series, indicates fat suppression, which makes fat dark so that other tissues stand out." = ""
"A gradient-echo image whose header shows neither spoiling (SP in Sequence Variant, or a low flip angle with a short TR) nor a T1 description, so its weighting is not named. Unspoiled gradient echo, such as balanced SSFP, is not T1-weighted. The tool does not guess when the header does not say." = ""
"The PET image is corrected for attenuation, the absorption of radiation by the body. Corrected images are the ones used for quantitative values such as SUV." = ""
"The PET image is not corrected for attenuation. It is often kept to check for artefacts of the correction." = ""
"Neither the description, the Image Type nor the Units say whether attenuation correction was applied. The tool does not guess when the header does not say." = ""
"Pixel values are activity concentration in becquerels per millilitre, from which SUV can be computed." = ""
"Pixel values are in grams per millilitre, the unit used for standardized uptake values (SUV)." = ""
"Pixel values are detected counts, not calibrated to activity." = ""
"Pixel values are in the unit shown, as recorded in the Units field." = ""
"A static acquisition records one image of the tracer distribution over the acquisition time." = ""
"A dynamic acquisition records a sequence of time frames to follow how the tracer moves over time." = ""
"A gated acquisition sorts data by heartbeat or breathing phase to reduce motion." = ""
"A whole-body acquisition covers a long part of the body in several bed positions joined together." = ""
"A maximum intensity projection shows the brightest value along each line of sight. In PET it gives a quick overview of the whole tracer distribution." = ""
"A static nuclear medicine image is a single planar picture of the tracer distribution." = ""
"A whole-body nuclear medicine image is a planar scan of the whole body, typically front and back. It is common for bone scans." = ""
"A dynamic nuclear medicine study is a sequence of planar images over time to follow tracer flow or uptake." = ""
"A gated nuclear medicine study sorts images by heartbeat phase, as used for heart function." = ""
"These are the raw projections of a SPECT acquisition, taken while the camera rotates. They are reconstructed into slices." = ""
"These are the raw projections of a gated SPECT acquisition, sorted by heartbeat phase." = ""
"These are slices reconstructed from a SPECT acquisition, showing the tracer distribution in 3D." = ""
"These are slices reconstructed from a gated SPECT acquisition, typically of the heart, one volume per heartbeat phase." = ""
"The nuclear medicine acquisition type shown is not in the tool's tables." = ""
"A planar nuclear medicine view taken from the front of the patient." = ""
"A planar nuclear medicine view taken from the back of the patient." = ""
"A planar nuclear medicine view taken from the side of the patient." = ""
"Neither Patient Orientation nor the series description names the view. The tool does not guess when the header does not say." = ""
"The series description names both the anterior and the posterior view, as for a whole-body scan stored with both views, so the view of this image is not named. The tool does not guess when the header does not say." = ""
"A projection radiograph: an X-ray image of a body part, flattened onto one plane." = ""
"An image from fluoroscopy, live X-ray imaging used to follow movement or guide procedures." = ""
"A panoramic dental radiograph shows the whole of both jaws and the teeth in one image." = ""
"An intra-oral dental radiograph is taken with the detector inside the mouth, showing a few teeth in detail." = ""
"Anteroposterior view: the X-rays pass from the front of the body to the back." = ""
"Posteroanterior view: the X-rays pass from the back of the body to the front. It is the standard view for an upright chest radiograph." = ""
"Lateral view with the patient's left side against the detector." = ""
"Lateral view with the patient's right side against the detector." = ""
"View taken with the patient lying on the right side and a horizontal X-ray beam." = ""
"View taken with the patient lying on the left side and a horizontal X-ray beam." = ""
"Oblique view with the patient turned so the right side is nearer the detector." = ""
"Oblique view with the patient turned so the left side is nearer the detector." = ""
"Lateral view: a side view of the body part. The side nearer the detector is not stated." = ""
"Oblique view: the body part is turned at an angle between frontal and lateral." = ""
"The View Position code shown is not in the tool's tables." = ""
"No view is recorded, but the image directions in Patient Orientation run left-right and head-feet, as in a frontal (AP or PA) view. Whether it is AP or PA is not known." = ""
"No view is recorded, but the image directions in Patient Orientation run front-back and head-feet, as in a lateral view." = ""
"No view is recorded, but the image directions in Patient Orientation run left-right and front-back, as in an axial view." = ""
"The header records the left side." = ""
"The header records the right side." = ""
"The header records both sides." = ""
"A mammogram is a low-dose X-ray image of the breast." = ""
"Breast tomosynthesis takes several low-dose images over an arc and builds thin slices of the breast. It reduces the overlap of tissue." = ""
