"Cranio-caudal view: the breast is compressed from above and imaged from top to bottom. Screening uses mainly CC and MLO." = ""
"Medio-lateral oblique view: the breast is imaged at an angle from the middle outward. It shows the most breast tissue, up into the armpit. Screening uses mainly CC and MLO." = ""
"Medio-lateral view: a straight side view of the breast, taken from the middle outward. Screening uses mainly CC and MLO." = ""
"Latero-medial view: a straight side view of the breast, taken from the outside inward. Screening uses mainly CC and MLO." = ""
"Latero-medial oblique view: an angled view taken from the outside inward. Screening uses mainly CC and MLO." = ""
"Caudo-cranial view (from below): the breast is imaged from bottom to top. Screening uses mainly CC and MLO." = ""
"Superolateral to inferomedial oblique view: an angled view from the upper outer side. Screening uses mainly CC and MLO." = ""
"Inferomedial to superolateral oblique view: an angled view from the lower inner side. Screening uses mainly CC and MLO." = ""
"Exaggerated cranio-caudal view, turned to include the outer part of the breast. Screening uses mainly CC and MLO." = ""
"Exaggerated cranio-caudal view, turned to include the inner part of the breast. Screening uses mainly CC and MLO." = ""
"Axillary tail view: an angled view of the outer upper part of the breast, toward the armpit. Screening uses mainly CC and MLO." = ""
"Cleavage view: both breasts are imaged together to show the tissue near the breastbone. Screening uses mainly CC and MLO." = ""
