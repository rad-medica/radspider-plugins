# Translation template of the plugin org.radspider.series-identifier: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)

[strings]

# plugin.toml
"Series identifier" = ""
"Says what the series on screen is, its plane or projection, and explains both. Rules over DICOM tags for every modality; dcm-classifier (Apache-2.0) as a second opinion on MR." = ""
"Identify series" = ""
"Runs on the image on screen: series type, plane or projection, region, laterality and contrast, each with the tag values that decided it and a short explanation. On MR, a second opinion from the dcm-classifier model. Educational aid; not for diagnosis." = ""

