# Test kit: Español (es). Made from template.toml (python -m radspider_plugin template <plugin dir>).

[language]
name = "Español"

[strings]

# plugin.toml
"Test kit" = "Kit de prueba"
"Exercises every plugin feature: three kinds, parameters, units, progress, messages, errors, cancel, reading and editing ROIs and segments, an interactive window, icons, translations, several windows per run." = "Prueba todas las funciones de los complementos: tres tipos, parámetros, unidades, progreso, mensajes, errores, cancelar, leer y editar ROI y segmentos, una ventana interactiva, iconos, traducciones, varias ventanas por ejecución."
"Scale + offset" = "Escala + desplazamiento"
"x · gain + offset. Keeps the unit: HU stay HU." = "x · ganancia + desplazamiento. Conserva la unidad: las HU siguen siendo HU."
"Gain" = "Ganancia"
"Offset" = "Desplazamiento"
"Normalize 0–1" = "Normalizar 0–1"
"(x − min) / (max − min) over the voxels with data. No unit: the result is a plain number." = "(x − mín) / (máx − mín) sobre los vóxeles con datos. Sin unidad: el resultado es un número sin más."
"Box smooth" = "Suavizado de caja"
"Mean over a box of the given radius in mm (uses the voxel spacing). Voxels without data stay without." = "Media en una caja del radio dado en mm (usa el espaciado de los vóxeles). Los vóxeles sin datos siguen sin ellos."
"Radius (mm)" = "Radio (mm)"
"Checkerboard" = "Tablero de ajedrez"
"Alternating blocks of the input and of no data (NaN): shows how no-data is drawn. Four parameters, the most a node takes." = "Bloques alternos de la entrada y de sin datos (NaN): muestra cómo se dibuja la ausencia de datos. Cuatro parámetros, el máximo de un nodo."
"Invert (0 / 1)" = "Invertir (0 / 1)"
"Three bands" = "Tres bandas"
"Three named segments from two cut values: below, between, above. Reports progress per slice." = "Tres segmentos con nombre a partir de dos valores de corte: por debajo, entre y por encima. Informa del progreso por corte."
"Low cut" = "Corte bajo"
"High cut" = "Corte alto"
"Largest island" = "Isla más grande"
"The largest 6-connected region at or above the threshold: one segment." = "La mayor región 6-conexa en el umbral o por encima: un segmento."
"Outside the segments" = "Fuera de los segmentos"
"Reads the existing segments: one new segment of every voxel with data that no segment holds yet." = "Lee los segmentos existentes: un segmento nuevo con cada vóxel con datos que aún no está en ningún segmento."
"Nothing (empty result)" = "Nada (resultado vacío)"
"Returns no labelled voxel: the viewer must say so and add no segment." = "No devuelve ningún vóxel etiquetado: el visor debe indicarlo y no añadir ningún segmento."
"Summary" = "Resumen"
"Count, mean, SD, percentiles and the volume of the voxels with data, with the series' unit. Sets a status message." = "Recuento, media, DE, percentiles y volumen de los vóxeles con datos, en la unidad de la serie. Muestra un mensaje de estado."
"Slice report" = "Informe del corte"
"Everything a tool can show: a chart (histogram of the slice on screen), a picture (that slice, windowed), ROIs added to the image (a box around the bright region, its centre, a note) and a segment (the bright region of the slice)." = "Todo lo que puede mostrar una herramienta: un gráfico (histograma del corte en pantalla), una imagen (ese corte, con ventana), ROI añadidas a la imagen (un recuadro alrededor de la región brillante, su centro, una nota) y un segmento (la región brillante del corte)."
"Bright above" = "Brillante por encima de"
"Histogram" = "Histograma"
"Value histogram as a table: a long result to scroll, copy and save as CSV." = "Histograma de valores como tabla: un resultado largo para desplazar, copiar y guardar como CSV."
"Bins" = "Intervalos"
"Slow (try Cancel)" = "Lento (pruebe Cancelar)"
"Counts for the given seconds, reporting progress: press Cancel to see the process stop." = "Cuenta los segundos indicados informando del progreso: pulse Cancelar para ver cómo se detiene el proceso."
"Fail on purpose" = "Fallar a propósito"
"Raises an error: the viewer must show its message and stay up." = "Lanza un error: el visor debe mostrar su mensaje y seguir funcionando."
"Read and edit the study" = "Leer y editar el estudio"
"Lists the series' measurements and segments, then edits them: moves the first measurement one voxel right, deletes the last, adds a note; grows the first unlocked segment by one voxel in-plane, renames and recolours it; tries to rename the locked ones (the viewer refuses and says so). Delete last = 1 also deletes the last unlocked segment." = "Enumera las mediciones y los segmentos de la serie y luego los edita: mueve la primera medición un vóxel a la derecha, borra la última, añade una nota; amplía el primer segmento desbloqueado un vóxel en el plano, le cambia el nombre y el color; intenta renombrar los bloqueados (el visor lo rechaza y lo indica). Borrar última = 1 borra también el último segmento desbloqueado."
"Delete last (0 / 1)" = "Borrar última (0 / 1)"
"Slice explorer" = "Explorador de cortes"
"An interactive window: pick a slice, a threshold, bins, log scale and a profile; the chart and picture follow. Mark adds a note on the slice." = "Una ventana interactiva: elija un corte, un umbral, intervalos, escala logarítmica y un perfil; el gráfico y la imagen se actualizan. Marcar añade una nota en el corte."
"Windows demo" = "Demostración de ventanas"
"Several windows from one run: a form first, then a main window (row, table, section), a residuals window with tabs and a log window kept as it is. A checkbox closes the residuals window, a button reopens it. Every text is translated (lang/)." = "Varias ventanas de una sola ejecución: primero un formulario, luego una ventana principal (fila, tabla, sección), una ventana de residuos con pestañas y una ventana de registro que se conserva tal cual. Una casilla cierra la ventana de residuos y un botón la vuelve a abrir. Todos los textos están traducidos (lang/)."

