# Translation template of the plugin org.radspider.testkit: its manifest texts and every literal text of rp.tr, rp.trc and rp.trn.
#
# Make a language: copy this file to lang/<tag>.toml (for example es.toml), fill in [language] and the
# translations. Empty value = the English text is shown. Keep every {placeholder}; their order may change.
# Plural entries are tables keyed by CLDR plural category: zero, one, two, few, many, other.
# The key of a message with a context is the context, a U+0004 character and the text.
# Generated by `python -m radspider_plugin template <plugin dir>`: do not edit by hand.

[language]
name = ""
# plural = "ru"    # CLDR plural rules of another language (default: this file's tag)
# base = "es"      # untranslated entries fall back here, then to English

[strings]

# plugin.toml
"Test kit" = ""
"Exercises every plugin feature: three kinds, parameters, units, progress, messages, errors, cancel, reading and editing ROIs and segments, an interactive window, icons, translations, several windows per run." = ""
"Scale + offset" = ""
"x · gain + offset. Keeps the unit: HU stay HU." = ""
"Gain" = ""
"Offset" = ""
"Normalize 0–1" = ""
"(x − min) / (max − min) over the voxels with data. No unit: the result is a plain number." = ""
"Box smooth" = ""
"Mean over a box of the given radius in mm (uses the voxel spacing). Voxels without data stay without." = ""
"Radius (mm)" = ""
"Checkerboard" = ""
"Alternating blocks of the input and of no data (NaN): shows how no-data is drawn. Four parameters, the most a node takes." = ""
"Invert (0 / 1)" = ""
"Three bands" = ""
"Three named segments from two cut values: below, between, above. Reports progress per slice." = ""
"Low cut" = ""
"High cut" = ""
"Largest island" = ""
"The largest 6-connected region at or above the threshold: one segment." = ""
"Outside the segments" = ""
"Reads the existing segments: one new segment of every voxel with data that no segment holds yet." = ""
"Nothing (empty result)" = ""
"Returns no labelled voxel: the viewer must say so and add no segment." = ""
"Summary" = ""
"Count, mean, SD, percentiles and the volume of the voxels with data, with the series' unit. Sets a status message." = ""
"Slice report" = ""
"Everything a tool can show: a chart (histogram of the slice on screen), a picture (that slice, windowed), ROIs added to the image (a box around the bright region, its centre, a note) and a segment (the bright region of the slice)." = ""
"Bright above" = ""
"Histogram" = ""
"Value histogram as a table: a long result to scroll, copy and save as CSV." = ""
"Bins" = ""
"Slow (try Cancel)" = ""
"Counts for the given seconds, reporting progress: press Cancel to see the process stop." = ""
"Fail on purpose" = ""
"Raises an error: the viewer must show its message and stay up." = ""
"Read and edit the study" = ""
"Lists the series' measurements and segments, then edits them: moves the first measurement one voxel right, deletes the last, adds a note; grows the first unlocked segment by one voxel in-plane, renames and recolours it; tries to rename the locked ones (the viewer refuses and says so). Delete last = 1 also deletes the last unlocked segment." = ""
"Delete last (0 / 1)" = ""
"Slice explorer" = ""
"An interactive window: pick a slice, a threshold, bins, log scale and a profile; the chart and picture follow. Mark adds a note on the slice." = ""
"Windows demo" = ""
"Several windows from one run: a form first, then a main window (row, table, section), a residuals window with tabs and a log window kept as it is. A checkbox closes the residuals window, a button reopens it. Every text is translated (lang/)." = ""

